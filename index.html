    <p class="small muted" style="margin-top:8px">Offline? Load the data files instead:</p>
    <div class="row"><label class="btn ghost">Load strains.json<input type="file" accept=".json" id="impStrains" hidden></label><label class="btn ghost">Load cards.json<input type="file" accept=".json" id="impCards" hidden></label><label class="btn ghost">Load factions.json<input type="file" accept=".json" id="impFactions" hidden></label><label class="btn ghost">Load collectables.json<input type="file" accept=".json" id="impSets" hidden></label><label class="btn ghost">Load card icons<input type="file" accept=".svg,.png,.jpg,.jpeg,.webp" id="impIcons" multiple hidden></label></div>
    <hr class="rule"><div class="row"><button class="btn sm ghost" data-act="theme">Theme: ${document.documentElement.dataset.theme||"auto"}</button><button class="btn sm ghost" data-act="credits">Set business Credits…</button><button class="btn sm ghost" data-act="setwallet">Set wallet…</button><button class="btn sm danger" data-act="newgame">New game…</button></div>
    ${UI.newGame?`<div class="slot" style="margin-top:10px;border-color:var(--bad)"><div class="lbl">New game</div>
     <p class="small" style="margin:4px 0 8px">When did Finn's Glintworks open? The save starts that morning at 7:00 AM with 1,000 Cr, the 6 starting strains, a 3-card starter pack and Emma's partnership. Your current save is replaced — download it first if you want a copy.</p>
     <div class="row" style="align-items:flex-end"><label class="f">Opening date<input type="date" id="ngDate" value="${isoOf(todayDN())}"></label>
      <button class="btn danger" data-act="newgo">Start new game</button><button class="btn ghost" data-act="newcancel">Cancel</button></div></div>`:""}
   </div></div>
   <div class="grid">
   <div class="panel"><h3>Rules &amp; placeholders</h3>
    <p class="small muted">Numbers from the docs are the defaults. Ones marked * aren't in the docs; they're picked so the tool runs — change them freely.</p>
    <h4>Business</h4><div class="row">${num("orderCap","Order cap")}${num("registration","Base dues / month")}${num("duesPerLevel","+ dues per Rep Level")}${num("referral","Referral %")}${num("urgentPct","Urgent %")}${num("urgentChance","Urgent chance %")}${num("levyPct","Trade Levy %")}${num("permit","Interplanar permit / yr")}${num("exportPermit","Export permit / yr")}${num("upkeep","Boat upkeep / month")}${num("ppPct","Perk Points % of sales")}${num("packBase","First pack (PP)")}${num("packStep","+ PP per pack bought")}</div>
    <h4 style="margin-top:8px">Sea &amp; Glint</h4><div class="row">${num("tankCap","Harvest tanks")}${num("discoveryPct","New strain chance %")}${num("mutWildPct","Wild mutation %")}${num("maxHull","Max Hull")}${num("hullRepair","Daily repair")}${num("repairCost","Repair Cr/point")}${num("salvageTow","Salvage tow")}</div>
    <h4 style="margin-top:8px">Workshop</h4><div class="row">${num("rackCap","Buds per rack")}${num("startRacks","Starting racks")}${num("rackPrice","Rack price")}${num("humidorCap","Buds per Humidor")}${num("humidorPrice","Humidor price")}${num("binCap","Parts bins")}${num("dryMana","Drying mana / rack / night",.1)}${num("sealMana","Seal mana / jar",.05)}${num("freshGrace","Fresh days (loose)")}${num("freshLoss","Freshness loss %/day")}${num("deliverMin","Delivery min days")}${num("deliverMax","Delivery max days")}</div>
    <h4 style="margin-top:8px">Tide pool &amp; pens</h4><div class="row">${num("poolCap","Tide pool plants")}${num("crossPct","Progress per cross %")}${num("mutCrossPct","Cross mutation %")}${num("jeffPct","Jeff naps here %")}${num("extractMana","Extraction mana",.1)}${num("addonPct","Pen add-on chance %")}${num("refillUnlock","Pens before refills")}${num("refillPct","Refill % per pen/day",.5)}${num("refillCap","Refills per day")}${num("penLoss","Pen lost %/day",.1)}${num("replacePct","Replacement %")}${num("prefPct","Preference bonus %")}</div>
    <h4 style="margin-top:8px">Collectables</h4><div class="row">${num("chestPct","Chest chance %")}${num("chestHold","Chest hold space")}${num("royaltyPct","Salvage Royalty %")}${num("setBonusPct","Full-set bonus %")}${num("surveyLimit","Survey sales / month")}${num("surveyPct","Standing bonus % / Level")}${num("auctionOpen","Opening bid %")}${num("auctionBid","Daily bid chance %")}${num("auctionFee","Salon fee %")}${num("auctionItemDays","Auction days (piece)")}${num("auctionSetDays","Auction days (set)")}${num("offworldPlanar","Off-world weight, Planar Seam *",.25)}${num("offworldNormal","Off-world weight, elsewhere *",.05)}</div>
    <h4 style="margin-top:8px">Lives</h4><div class="row">${num("livesCap","Feather cap")}${num("lifeCost","Feather price")}</div>
    <p class="tiny muted" style="margin-top:8px">* Opening stock is a placeholder for the doc's "a crate of mana cores, jars, flavor bottles": 50 mana cores, 20 cartridge shells, 10 brass bodies, 10 plain mouthpieces, 10 small jars, 10 jars, 2 extra large jars, and a standard bottle each of Peach and Mango. Part prices, shells (0.5 Cr), Jeff's 40% and the Peach + Mango drops for ${HOUSE_BLEND} are placeholders too. For chests: each set is equally likely, except the off-world sets (Shi'ar, Asgardian), which weigh 4× in Planar Seam chests and ¼ elsewhere; display picking your best copies is a placeholder as well.</p>
   </div></div></div>`;
};

/* ================================================================
   EVENTS
   ================================================================ */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab],[data-act],[data-ltab],[data-codex]");if(!t)return;
  if(t.dataset.tab){e.preventDefault();UI.tab=t.dataset.tab;render();window.scrollTo({top:0});return}
  if(t.dataset.codex){UI.codex=t.dataset.codex;render();return}
  if(t.dataset.ltab){e.preventDefault();UI.ledgerTab=t.dataset.ltab;render();return}
  const a=t.dataset.act,id=t.dataset.id,o=t.dataset.o,i=+t.dataset.i;
  if(t.tagName==="A")e.preventDefault();
  switch(a){
   case"unboxbg":if(t!==e.target)break; /* falls through */
   case"unboxclose":UI.unbox=null;render();break;
   case"hoist":hoistChest();break; case"openchest":openChest(id);break;
   case"catalog":catalog(false,id);break; case"catalogall":UI.unbox=null;catalog(true);break;
   case"display":displaySet(t.dataset.k);break; case"takedown":takeDown(t.dataset.k);break;
   case"survey":sellSurvey(t.dataset.kind,t.dataset.k);break; case"consign":consign(t.dataset.kind,t.dataset.k);break;
   case"repair":repairHull(t.dataset.pts?+t.dataset.pts:null);break;
   case"sail":sail(id);break; case"harvest":harvest();break; case"home":returnHome();break;
   case"loadracks":loadRacksNow();break; case"dumptank":dumpTank(id);break;
   case"tohumidor":looseToHumidor(id);break; case"discard":discardLot(t.dataset.where,id);break;
   case"keepwhole":keepWhole();break; case"poolharvest":harvestPool(id);break; case"release":releasePlant(id);break;
   case"cross":{const pk=UI.crossPick||[];if(pk.length===2){UI.crossPick=[];cross(pk[0],pk[1])}break}
   case"tool":toolPart(t.dataset.k);break; case"buypart":orderPart(t.dataset.k,t.dataset.pk);break; case"buybottle":orderBottle(t.dataset.f,t.dataset.size);break;
   case"fillcart":{const sel=document.querySelector(`select[data-src="${o}"][data-i="${i}"]`);fillCart(o,i,sel?sel.value:null);break}
   case"assemble":{const ch={};document.querySelectorAll(`select[data-part="${o}"][data-i="${i}"]`).forEach(s=>ch[s.dataset.kind]=s.value);assemblePen(o,i,ch);break}
   case"buyjar":orderJars(t.dataset.size,t.dataset.pk);break; case"buyrack":orderRack();break; case"buyhumidor":orderHumidor();break;
   case"accept":accept(o);break; case"decline":decline(o);break; case"abandon":abandon(o);break;
   case"jar":{const sel=document.querySelector(`select[data-src="${o}"][data-i="${i}"]`);jarItem(o,i,sel?sel.value:null);break}
   case"unjar":unjar(o,i);break;
   case"pack":packOrder(o);break; case"send":sendOrder(o);break;
   case"reg":register(t.dataset.k);break;
   case"stat":addStat(t.dataset.k);break;
   case"buypack":buyPack();break; case"openpack":openPack(+t.dataset.i);break;
   case"recut":recutCard(id);break; case"cleardraw":S.lastDraw=null;commit();break;
   case"buylife":buyLife();break; case"die":spendLife();break;
   case"ghconnect":ghConnect();break; case"ghpush":GH.pushSave();break;
   case"ghpull":GH.pullSave(true).then(r=>{toast(r==="none"?"No save.json in the repo yet.":"Loaded the save from GitHub.");render()}).catch(err=>toast(err.message));break;
   case"ghforget":{const c=GH.cfg();if(c){c.token="";lsSet(LS.gh,c)}syncState="off";syncMsg="Not connected";render();break}
   case"export":download("save.json",JSON.stringify(S,null,1));break;
   case"setwallet":{const v=prompt("Set Finn's personal wallet to:",S.wallet);if(v!=null&&!isNaN(+v)){walletLog(+v-S.wallet,"Manual adjustment");S.wallet=r2(+v);commit()}break}
   case"buyout":buyout();break; case"wspend":walletSpend();break; case"wtobiz":walletToBiz();break;
   case"addhire":{S.payroll.push({id:nid("hire"),name:"New hire",role:"Assistant",start:S.clock.day,schedule:"monthly",amount:200,owed:0,wallet:false});addLog("Added a new row to the Salary Ledger.");commit();break}
   case"endhire":{const r=S.payroll.find(x=>x.id===t.dataset.id);if(!r)break;if(r.owed>0&&!confirm(`${r.name} is still owed ${cr(r.owed)}. Remove anyway? The owed pay is dropped.`))break;
     if(!(r.owed>0)&&!confirm(`Remove ${r.name} from the Salary Ledger?`))break;S.payroll=S.payroll.filter(x=>x!==r);addLog(`${r.name} left the Salary Ledger.`);commit();break}
   case"dayexport":{const v=$("#dayPick").value;if(!v){toast("Pick a day.");break}download(`finn-glint-day-${v}.md`,dayMD(dnOf(v)),"text/markdown");break}
   case"daycopy":{const v=$("#dayPick").value;if(!v)break;const txt=dayMD(dnOf(v));(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("Day copied.")).catch(()=>toast("Couldn't copy — use Download instead."));break}
   case"jump":jumpDate($("#jumpDate").value,false);break;
   case"jumpsim":jumpDate($("#jumpDate").value,true);break;
   case"snapcopy":{const txt=snapshotMD();(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast("Snapshot copied.")).catch(()=>{const ta=$("#snapText");ta.select();document.execCommand("copy");toast("Snapshot copied.")});break}
   case"snapdl":download(`finn-glint-snapshot-${isoOf(S.clock.day)}.md`,snapshotMD(),"text/markdown");break;
   case"theme":{const r=document.documentElement,n={auto:"light",light:"dark",dark:"auto"}[r.dataset.theme||"auto"];if(n==="auto")delete r.dataset.theme;else r.dataset.theme=n;lsSet(LS.theme,n);render();break}
   case"credits":{const v=prompt("Set the business balance to:",S.credits);if(v!=null&&!isNaN(+v)){money(+v-S.credits,"Manual adjustment","none");commit()}break}
   case"newgame":UI.newGame=true;render();$("#ngDate")?.focus();break;
   case"newcancel":UI.newGame=false;render();break;
   case"newgo":{const v=$("#ngDate").value;if(!v){toast("Pick an opening date.");break}
     if(!confirm(`Start a new game with Finn's Glintworks opening on ${fmtDate(dnOf(v))}? Your current save is replaced.`))break;
     UI.newGame=false;newGame(dnOf(v));lsSet(LS.dirty,true);commit();toast(`New game — Finn's Glintworks opens ${fmtDate(S.clock.day)}.`);break}
  }
});
document.addEventListener("input",e=>{if(e.target.id==="cxQ"){UI.cxQ=e.target.value;clearTimeout(UI.qT);UI.qT=setTimeout(()=>{render();const el=$("#cxQ");if(el){el.focus();el.setSelectionRange(el.value.length,el.value.length)}},250)}});
document.addEventListener("change",e=>{
  const t=e.target;
  if(t.dataset.cfg){S.config[t.dataset.cfg]=+t.value;commit();return}
  if(t.dataset.equip){equipCard(t.dataset.equip,+t.value);return}
  if(t.dataset.pick){let pk=(UI.crossPick||[]).filter(x=>S.pool.some(p=>p.id===x));if(t.checked){pk.push(t.dataset.pick);if(pk.length>2)pk=pk.slice(-2)}else pk=pk.filter(x=>x!==t.dataset.pick);UI.crossPick=pk;render();return}
  if(t.dataset.patron){const c=S.cards[t.dataset.patron];if(c){c.faction=t.value;addLog(`Patron's Favor now favors ${FAC[t.value].name}.`);commit()}return}
  if(t.dataset.cx){UI[t.dataset.cx]=t.value;render();return}
  if(t.dataset.pay){const r=(S.payroll||[]).find(x=>x.id===t.dataset.pay),f=t.dataset.f;if(!r)return;
    if(f==="amount"){if(!(+t.value>=0)){toast("Amount must be a number.");render();return}r.amount=+t.value}
    else if(f==="start"){if(!t.value){render();return}r.start=dnOf(t.value)}
    else r[f]=t.value;
    addLog(`Salary Ledger: ${r.name}'s ${f==="schedule"?"pay schedule":f} updated.`);commit();return}
  if(t.dataset.lm){UI.lm=UI.lm||{};UI.lm[t.dataset.lm]=t.value;render();return}
  if(t.id==="impIcons"){const fs=[...t.files];Promise.all(fs.map(f=>new Promise(res=>{const rd=new FileReader();rd.onload=()=>{ICONS[f.name]=rd.result;ICON_SHA[f.name]=null;res()};rd.readAsDataURL(f)}))).then(()=>{saveIcons();toast(`${plural(fs.length,"card icon")} loaded.`);render()});return}
  if(["impSave","impStrains","impFactions","impCards","impSets"].includes(t.id)){
    const file=t.files[0];if(!file)return;file.text().then(txt=>{
      try{const j=JSON.parse(txt);
        if(t.id==="impSave"){S=migrate(j);lsSet(LS.dirty,true);commit();toast("Save imported.")}
        else if(t.id==="impStrains"){setStrains(j);saveDB();toast(`${DB.strains.length} strains loaded.`);commit()}
        else if(t.id==="impFactions"){setFactions(j);saveDB();toast("Factions loaded.");render()}
        else if(t.id==="impSets"){setCollectables(j);saveDB();toast(`${DB.sets.length} Collectable sets loaded.`);render()}
        else{setCards(j);saveDB();toast(`${DB.cards.length} cards loaded.`);render()}
      }catch(err){console.error(err);toast("That file isn't valid JSON.")}});
  }
});
$("#endDayBtn").addEventListener("click",endDay);
$("#snapBtn").addEventListener("click",()=>{UI.tab="snapshot";render();window.scrollTo({top:0})});
function download(name,text,type="application/json"){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
async function ghConnect(){
  const c={owner:$("#ghOwner").value.trim(),repo:$("#ghRepo").value.trim(),branch:$("#ghBranch").value.trim()||"main",token:$("#ghToken").value.trim(),mode:$("#ghMode").value};
  lsSet(LS.gh,c);
  if(!GH.ready()){toast("Fill in owner, repo and token.");return}
  syncState="busy";syncMsg="Connecting…";render();
  try{
    const got=await GH.loadDBs();
    const r=await GH.pullSave(false);
    if(r==="none"){await GH.pushSave()}
    else{syncState=lsGet(LS.dirty,false)?"dirty":"ok";syncMsg=r==="loaded"?"Loaded save from GitHub":"Connected — this browser's save kept"}
    toast(`Connected. ${DB.strains.length} strains, ${(DB.cards||[]).length} cards${got.strains&&got.factions&&got.cards&&got.sets?"":" (a data file is missing from the repo)"}.`);
  }catch(err){syncState="err";syncMsg=err.message}
  render();
}

/* ================================================================
   BOOT
   ================================================================ */
(async function boot(){
  const th=lsGet(LS.theme,"auto");if(th!=="auto")document.documentElement.dataset.theme=th;
  const db=lsGet(LS.db,{});if(db.strains)setStrains(db);if(db.factions)setFactions(db);if(db.cards)setCards({cards:db.cards,credits:db.cardCredits});if(db.sets)setCollectables({sets:db.sets});
  loadIconCache();
  const local=lsGet(LS.save,null);
  if(local)S=migrate(local);else newGame();
  render();
  if(GH.ready()){
    syncState="busy";syncMsg="Syncing…";renderStatus();
    try{await GH.loadDBs();const r=await GH.pullSave(false);if(r==="none")await GH.pushSave();
      else{syncState=lsGet(LS.dirty,false)?"dirty":"ok";syncMsg=lsGet(LS.dirty,false)?"Unsynced changes":"In sync with GitHub"}}
    catch(e){syncState="err";syncMsg=e.message}
    render();
  }else{saveLocal(false)}
  addEventListener("beforeunload",()=>{if(GH.ready()&&lsGet(LS.dirty,false)&&GH.mode()!=="manual"){GH.pushSave()}});
})();
</script>

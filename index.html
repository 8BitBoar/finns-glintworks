<style>
:root{
  --vio:#5a3a86; --vio-d:#3b2460; --vio-dd:#24123a; --vio-l:#b9a2e0; --vio-wash:#ece6f5;
  --silver:#c9ccd6; --silver-l:#eceef4;
  --verd:#2f6b62; --verd-d:#1d4641; --verd-l:#8fbfb3;
  --brass:#a8823f; --brass-d:#7c5f2a; --brass-l:#d8bf86;
  --pearl:#f5f3ef; --pearl-2:#ebe7e0; --card:#fcfbf8;
  --ink:#1f1d26; --ink-2:#4d4a58; --ink-3:#807c8c;
  --line:#dcd6cc; --line-2:#c7bfb2;
  --good:#2f7d4f; --bad:#a6402f; --warn:#b07b18;
  --sea:#17383a; --glow:#d9c8ff;
  --shadow:0 1px 2px rgba(30,20,40,.08),0 4px 14px rgba(30,20,40,.06);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --pearl:#16131c; --pearl-2:#1e1a26; --card:#221d2b;
    --ink:#ece8f2; --ink-2:#c0bacb; --ink-3:#8e889a;
    --line:#352e40; --line-2:#4a4158; --vio-wash:#2b2238;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --pearl:#16131c; --pearl-2:#1e1a26; --card:#221d2b;
  --ink:#ece8f2; --ink-2:#c0bacb; --ink-3:#8e889a;
  --line:#352e40; --line-2:#4a4158; --vio-wash:#2b2238;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--pearl);color:var(--ink);font:15px/1.45 "Source Sans 3",system-ui,sans-serif;font-variant-numeric:tabular-nums}
h1,h2,h3,h4{font-family:"Cormorant Garamond",Georgia,serif;margin:0;font-weight:600;letter-spacing:.01em}
h2{font-size:1.6rem} h3{font-size:1.25rem} h4{font-size:1.05rem}
button,select,input{font:inherit;color:inherit}
a{color:var(--vio)}
:root[data-theme="dark"] a{color:var(--vio-l)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) a{color:var(--vio-l)}}
.wrap{max-width:1240px;margin:0 auto;padding:0 16px}

header{background:linear-gradient(180deg,var(--vio-dd),var(--vio-d));color:var(--silver-l);border-bottom:3px solid var(--brass)}
.hdr{display:flex;align-items:center;gap:14px;padding:12px 0}
.hdr h1{font-size:1.75rem;line-height:1;color:var(--silver-l)}
.hdr .sub{font-size:.8rem;color:var(--silver);letter-spacing:.12em;text-transform:uppercase}
.seal{width:52px;height:52px;flex:none}
@media (max-width:600px){.hdr{gap:8px}.hdr h1{font-size:1.3rem}.hdr .sub{font-size:.66rem;letter-spacing:.06em}.seal{width:40px;height:40px}.hdr .btn{padding:5px 8px;font-size:.82rem}}
.status{display:flex;flex-wrap:wrap;gap:6px 8px;padding:0 0 12px;align-items:center}
.pill{background:rgba(255,255,255,.07);border:1px solid rgba(201,204,214,.35);border-radius:999px;padding:4px 11px;font-size:.88rem;white-space:nowrap}
.pill b{color:var(--brass-l);font-weight:600}
.pill.clock{font-size:1rem;background:rgba(201,162,39,.14);border-color:var(--brass)}
.pill.late{border-color:#e0a35a;color:#ffd9a6}
.pill.warn{border-color:#d9714f;color:#ffc3ad}
.spacer{flex:1}
.sync{display:inline-flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;background:#888;display:inline-block}
.dot.ok{background:#62d39a}.dot.dirty{background:#e8b04a}.dot.err{background:#e06a55}.dot.off{background:#888}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:none;border:0;color:#ddd3ef;padding:9px 14px;border-radius:8px 8px 0 0;cursor:pointer;white-space:nowrap;font-weight:600;font-size:.93rem}
nav.tabs button.on{background:var(--pearl);color:var(--vio-d)}
:root[data-theme="dark"] nav.tabs button.on{color:var(--vio-l)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) nav.tabs button.on{color:var(--vio-l)}}
nav.tabs button .badge{background:var(--brass);color:#fff;border-radius:999px;font-size:.72rem;padding:0 6px;margin-left:5px}

main{padding:18px 0 40px}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.g2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g2e{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;align-items:start}
@media (max-width:860px){.g2,.g2e,.g3{grid-template-columns:1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px 16px}
.panel h3{margin-bottom:8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.panel h3 .meta{white-space:nowrap;margin-left:auto;font-family:"Source Sans 3";font-size:.85rem;color:var(--ink-3);font-weight:500}
.muted{color:var(--ink-3)} .small{font-size:.85rem} .tiny{font-size:.76rem}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
hr.rule{border:0;border-top:1px dashed var(--line-2);margin:10px 0}

.btn{background:var(--vio);color:#fff;border:1px solid var(--vio-d);border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:.9rem;line-height:1.2}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.brass{background:var(--brass);border-color:var(--brass-d)}
.btn.verd{background:var(--verd);border-color:var(--verd-d)}
.btn.ghost{background:transparent;color:var(--vio);border-color:var(--line-2)}
:root[data-theme="dark"] .btn.ghost{color:var(--vio-l)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.ghost{color:var(--vio-l)}}
.btn.danger{background:var(--bad);border-color:#7c2e21}
.btn.sm{padding:3px 9px;font-size:.82rem}
.btn.end{background:var(--brass-l);border-color:var(--brass-d);color:#231a05}
select,input[type=text],input[type=number],input[type=password],input[type=date]{background:var(--pearl);border:1px solid var(--line-2);border-radius:7px;padding:5px 8px;max-width:100%}
input[type=number]{width:90px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:.84rem;color:var(--ink-2)}

table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:5px 7px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600}
.tscroll{overflow-x:auto}

.tag{display:inline-block;border-radius:999px;padding:1px 8px;font-size:.76rem;font-weight:600;border:1px solid var(--line-2);background:var(--pearl-2);white-space:nowrap}
.tag.r-Common{color:#5f6461}.tag.r-Uncommon{color:#2f7d4f}.tag.r-Rare{color:#2b5fa0}.tag.r-Mythic{color:#a0402b}.tag.r-Beyond{color:#7a3fb0;background:#f0e6fa;border-color:#cdb0e0}
.tag.tier-Uncommon{color:#2f7d4f}.tag.tier-Rare{color:#2b5fa0;border-color:#9fb7d8}.tag.tier-Legendary{color:#7a5410;background:#f6e6b0;border-color:#d8bd62}
.tag.mut{background:#efe1f6;color:#5b2e7a;border-color:#cdb0e0}
.tag.urgent{background:#f6d7cf;color:#8c2f1e;border-color:#e2a593}
.tag.ok{background:#d6ecdc;color:#1f6138;border-color:#9fcfae}
.tag.no{background:#f3dcd6;color:#8c2f1e;border-color:#e2b0a2}
.tag.warn{background:#f6e8c8;color:#7a5410;border-color:#e0c486}
.pips{display:inline-flex;gap:2px;vertical-align:-1px}
.pip{width:11px;height:11px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.35);box-shadow:inset -1px -1px 2px rgba(0,0,0,.2)}
.pip.C{background:repeating-linear-gradient(45deg,#bbb,#bbb 2px,#ddd 2px,#ddd 4px)}
.fresh{display:inline-block;min-width:44px}

.mapbox{position:relative;border-radius:var(--r);overflow:hidden;border:2px solid var(--brass);background:var(--sea)}
.mapbox svg{display:block;width:100%;height:auto}
.node{cursor:pointer}
.node .ring{fill:rgba(185,162,224,.16);stroke:var(--glow);stroke-width:2.5}
.node .halo{fill:none;stroke:var(--glow);stroke-opacity:.5;animation:pulse 2.6s ease-out infinite}
.node.sel .ring{stroke:#ffe9a8;fill:rgba(201,162,39,.2)}
.node text{font:600 13px "Source Sans 3";fill:#f3edff;text-anchor:middle;pointer-events:none}
.node text.c{fill:#ffe9a8}
@media (max-width:600px){.node text{font-size:24px}.node .ring{stroke-width:4}}
@keyframes pulse{0%{r:20;stroke-opacity:.7}100%{r:40;stroke-opacity:0}}
@media (prefers-reduced-motion:reduce){.node .halo{animation:none}}

.wo{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.wo-h{padding:10px 14px;background:linear-gradient(180deg,var(--vio-wash),transparent);border-bottom:1px dashed var(--line-2)}
.wo-h .fac{font-size:.76rem;text-transform:uppercase;letter-spacing:.08em;color:var(--brass-d);font-weight:700}
.wo-h h4{font-size:1.15rem;margin:2px 0}
.wo-b{padding:8px 14px;flex:1}
.slot{border:1px solid var(--line);border-radius:8px;padding:7px 9px;margin:7px 0;background:var(--pearl)}
.slot.pass{border-color:#9fcfae;background:color-mix(in srgb,var(--pearl) 85%,#2f7d4f)}
.slot .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:700}
.slot .req{font-weight:600}
.wo-f{padding:9px 14px;border-top:1px solid var(--line);background:var(--pearl-2)}
.wo .quote{font-family:"Cormorant Garamond",serif;font-style:italic;color:var(--ink-2);font-size:1rem;margin:4px 0 0}
.price{font-family:"Cormorant Garamond",serif;font-size:1.4rem;font-weight:700;color:var(--vio-d)}
:root[data-theme="dark"] .price{color:var(--vio-l)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .price{color:var(--vio-l)}}
.stages{display:flex;gap:4px;margin:6px 0}
.stages span{flex:1;height:5px;border-radius:3px;background:var(--line)}
.stages span.on{background:var(--brass)}

.bar{height:9px;background:var(--line);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--vio),var(--vio-l))}
.bar.brass i{background:linear-gradient(90deg,var(--brass-d),var(--brass-l))}
.bar.verd i{background:linear-gradient(90deg,var(--verd),var(--verd-l))}
.bar.warnbar i{background:linear-gradient(90deg,#9c3b2f,#d9714f)}
.forecast{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin:6px 0}
.fc{border:1px solid var(--line);border-radius:8px;padding:5px 2px;text-align:center;line-height:1.15;overflow:hidden}
.fc .tiny{overflow-wrap:anywhere;font-size:.68rem}
.fc.today{border-color:var(--brass);background:rgba(201,162,39,.10)}
.fc.guess{border-style:dashed;opacity:.72}
.fci{font-size:1.25rem;margin:2px 0}
.rack{border:1px solid var(--line);border-radius:8px;padding:7px 9px;margin:6px 0;background:var(--pearl)}

.log{max-height:430px;overflow:auto;font-size:.88rem}
.log div{padding:4px 0;border-bottom:1px dotted var(--line)}
.log .t{color:var(--ink-3);font-size:.78rem;margin-right:6px}
td.cr-plus,td.cr-minus,.nowrap,table.money td:last-child{white-space:nowrap}
.cr-plus{color:var(--good);font-weight:600}.cr-minus{color:var(--bad);font-weight:600}

footer.credits{border-top:1px solid var(--line);padding:14px 0 28px;color:var(--ink-3);font-size:.78rem;line-height:1.5}
footer.credits p{margin:0 0 6px;max-width:900px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:var(--vio-dd);color:var(--silver-l);border:1px solid var(--brass);padding:9px 16px;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.3);z-index:50;max-width:min(92vw,560px);opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
.banner{background:#f6e8c8;color:#5e420d;border:1px solid #e0c486;border-radius:8px;padding:9px 12px;margin-bottom:14px}
.empty{color:var(--ink-3);font-style:italic;padding:8px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:.9rem}
.kv dt{color:var(--ink-3)} .kv dd{margin:0}
.statbox{text-align:center;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--pearl)}
.statbox .n{font-family:"Cormorant Garamond",serif;font-size:2.2rem;font-weight:700;line-height:1}
.cardgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;align-items:start}
.pcard{--st:#2f6b62;background:var(--card);border:3px solid var(--st);border-radius:14px;padding:8px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.pcard.st-precision{--st:#a8823f}.pcard.st-renown{--st:#7a4a9e}
.pcard.sig{box-shadow:0 0 0 2px var(--brass-l),var(--shadow)}
.pcard.equipped{background:color-mix(in srgb,var(--card) 88%,var(--st))}
.pcard.unknown{opacity:.6;border-style:dashed}
.pc-name{display:flex;justify-content:space-between;align-items:center;gap:6px;font-family:"Cormorant Garamond",serif;font-weight:700;font-size:1.12rem;border-bottom:1px solid var(--line);padding-bottom:4px}
.pc-art{aspect-ratio:4/3;border-radius:8px;background:var(--pearl-2);display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid var(--line)}
.pc-art img{width:62%;height:62%;object-fit:contain}
.pc-type{font-size:.76rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);font-weight:600}
.pc-text{background:var(--pearl);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-height:72px}
.pc-flavor{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:.98rem;color:var(--ink-2);margin-top:5px;border-top:1px dotted var(--line-2);padding-top:4px}
.pc-foot{margin-top:2px}
.rk{display:flex;gap:4px;justify-content:center}.rk i{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--st);display:inline-block}.rk i.on{background:color-mix(in srgb,var(--st) 35%,transparent)}.rk i.eq{background:var(--st)}
.strain{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card)}
.strain.unknown{opacity:.6;border-style:dashed}
.strain .nm{font-family:"Cormorant Garamond",serif;font-size:1.15rem;font-weight:700;font-style:italic}
.strain .fl{font-family:"Cormorant Garamond",serif;font-style:italic;color:var(--ink-2);margin-top:4px}
details summary{cursor:pointer;font-weight:600}
/* Curio Room & unboxing */
body.noscroll{overflow:hidden}
.ovl{position:fixed;inset:0;background:rgba(20,10,32,.72);display:flex;align-items:center;justify-content:center;z-index:60;padding:14px}
.unbox{background:var(--card);border:3px solid var(--brass);border-radius:16px;max-width:520px;width:100%;max-height:92vh;overflow:auto;padding:16px 18px;box-shadow:0 18px 60px rgba(0,0,0,.5)}
.bigchest{display:block;width:200px;height:150px;margin:0 auto;overflow:visible}
.ublid{transform-box:fill-box;transform-origin:50% 100%;animation:ublid .7s 1s cubic-bezier(.3,1.4,.5,1) forwards}
.bigchest{animation:ubwobble 1s ease-in-out}
.ubburst{opacity:0;animation:ubburst 1.2s 1.15s ease-out forwards}
@keyframes ubwobble{0%,100%{transform:rotate(0)}15%{transform:rotate(-5deg)}30%{transform:rotate(4deg)}45%{transform:rotate(-3deg)}60%{transform:rotate(2deg)}75%{transform:rotate(-1deg)}}
@keyframes ublid{to{transform:translateY(-26px) rotate(-24deg)}}
@keyframes ubburst{0%{opacity:0;transform:scale(.4)}35%{opacity:1}100%{opacity:.45;transform:scale(1.15)}}
.ubburst{transform-box:fill-box;transform-origin:center}
.ubcoins{text-align:center;font-weight:700;color:var(--brass);margin:4px 0 8px;opacity:0;animation:ubfade .4s var(--d) forwards}
.ubitems{display:grid;gap:8px}
.ubitem{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--pearl);opacity:0;transform:perspective(500px) rotateX(80deg) translateY(16px);animation:ubflip .55s var(--d) cubic-bezier(.2,1.3,.4,1) forwards}
.ubic{flex:0 0 auto;border-radius:50%;animation:ubglowp 1.4s calc(var(--d) + .3s) ease-out 1}
.ubic svg{display:block}
@keyframes ubflip{to{opacity:1;transform:none}}
@keyframes ubglowp{0%{box-shadow:0 0 0 0 var(--glow)}30%{box-shadow:0 0 22px 8px var(--glow)}100%{box-shadow:0 0 6px 1px var(--glow)}}
.ubitem{box-shadow:inset 3px 0 0 var(--glow)}
.ubcheck{margin-top:12px;border-top:1px dashed var(--line-2);padding-top:8px;opacity:0;animation:ubfade .4s var(--d) forwards}
.ubticks{display:flex;gap:5px;margin:3px 0 7px;flex-wrap:wrap}
.ubtick{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-2);display:inline-flex;align-items:center;justify-content:center;font-size:.8rem;color:var(--ink-3)}
.ubtick.on{background:var(--verd);border-color:var(--verd-d);color:#fff}
.ubtick.fresh{animation:ubtick .5s calc(var(--d,0s) + .2s) ease-out both}
@keyframes ubtick{0%{transform:scale(0)}70%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes ubfade{to{opacity:1}}
.unbox.static .bigchest,.unbox.static .ublid,.unbox.static .ubburst,.unbox.static .ubitem,.unbox.static .ubcoins,.unbox.static .ubcheck,.unbox.static .ubic,.unbox.static .ubtick{animation-duration:0s!important;animation-delay:0s!important}
@media (prefers-reduced-motion:reduce){.unbox *{animation-duration:0s!important;animation-delay:0s!important}}
.chestrow{display:flex;gap:10px;flex-wrap:wrap}
.chestcard{border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:center;background:var(--pearl);display:flex;flex-direction:column;align-items:center;gap:3px;min-width:120px}
.chesti{vertical-align:middle}
.setcard{border-top:4px solid var(--hue)}
.setcard.shown{box-shadow:0 0 0 2px var(--brass-l),var(--shadow)}
.piecegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:6px;margin-top:6px}
.piece,.cxitem{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:5px 7px;min-width:0}
.cxitem{margin-top:6px;align-items:flex-start}
.piece.missing,.cxitem.missing{border-style:dashed;opacity:.65}
.qm{width:30px;height:30px;flex:0 0 30px;border-radius:50%;border:1.5px dashed var(--line-2);display:inline-flex;align-items:center;justify-content:center;color:var(--ink-3);font-weight:700}
.fl{font-family:"Cormorant Garamond",serif;font-style:italic;color:var(--ink-2)}

function wpick(entries){
  if(!Array.isArray(entries))entries=Object.entries(entries);
  entries=entries.filter(([,w])=>w>0);
  if(!entries.length)return null;
  let t=entries.reduce((s,[,w])=>s+w,0),r=Math.random()*t;
  for(const [v,w] of entries){r-=w;if(r<0)return v}
  return entries[entries.length-1][0];
}

function rollTag(exclude){
  const w=wxNow();
  const tiers={...TAG_TIERS};if(w==="Rán's Temper"){tiers.Common=68;tiers.Legendary=3}
  if(eff("ransFavorite"))tiers.Legendary*=2;
  // cards that make a tag "+N% likelier" give it N extra percentage points on every tag roll
  const boosts=shuffle([["Shark Run",eff("sharkPct")],["Planar Seam",eff("seamPct")+setBonus("seamPct")],["Rán's Net",setBonus("ransNetPct")],["Wave-Touched",eff("sisterPct")],
    ...WUBRG.map(c=>[COLOR_TAG[c],10*eff("color"+c)])]);
  for(const [t,pp] of boosts)if(pp>0&&!exclude.includes(t)&&Math.random()*100<pp)return t;
  const boost=(w==="Plankton Bloom"&&"Shark Run")||(w==="Cold Snap"&&"Rich")||null;
  const tw=(t,k)=>t===boost?(k>3?3*(k-1)/(k-3):50):1; // exactly 3× as likely within its tier
  for(let i=0;i<50;i++){const tier=wpick(tiers),pool=Object.keys(TAGS).filter(t=>TAGS[t].tier===tier&&!exclude.includes(t));if(pool.length)return wpick(pool.map(t=>[t,tw(t,pool.length)]))}
  return pick(Object.keys(TAGS).filter(t=>!exclude.includes(t)));
}

  let a=rint(3,6)+(tags.includes("Rich")?2:0)+(tags.includes("Shark Run")?1:0)+(wave==="Bylgja"?1:0)+(tags.includes("Reef")?setBonus("reefPlants"):0);

function colorWeight(s,cols,wave){let w=1;for(const c of cols)if(s.colors.includes(c))w*=3;if(wave==="Blóðughadda"&&s.colors.includes("R"))w*=9;return w}
function unknownMono(cols){
  const all=DB.strains.filter(s=>isMono(s)&&!S.codex.found[s.id]);
  if(!cols.length)return all;
  return all.filter(s=>s.colors.some(c=>cols.includes(c)));
}
function rollStrain(n,first){
  const cols=nodeColors(n),wave=sisterOf(n);
  // Planar Seam: the first plant is a mono strain she hasn't found (weighted to the node's colors)
  if(first&&hasTag(n,"Planar Seam")){const u=DB.strains.filter(s=>isMono(s)&&!S.codex.found[s.id]);if(u.length)return {id:wpick(u.map(s=>[s.id,colorWeight(s,cols,wave)])),discovery:true}}
  if(Math.random()*100<cfg().discoveryPct){const u=unknownMono(cols);if(u.length)return {id:pick(u).id,discovery:true}}
  const pool=wildPool();if(!pool.length)return null;
  const w=SPREAD_ODDS.slice();
  for(const t of ["Deep","Storm Front"])if(hasTag(n,t))SPREAD_SHIFT[t].forEach((d,i)=>w[i]+=d);
  if(wxNow()==="Squalls")SPREAD_SHIFT.Squalls.forEach((d,i)=>w[i]+=d);
  const levels=SPREADS.map((_,i)=>i).filter(i=>pool.some(s=>spreadIdx(s)===i));
  const lv=wpick(levels.map(i=>[i,Math.max(0,w[i])]))??levels[0];
  const at=pool.filter(s=>spreadIdx(s)===lv);
  return {id:wpick(at.map(s=>[s.id,colorWeight(s,cols,wave)])),discovery:false};
}
function rollMutations(n,first){
  const list=Object.keys(S.mutations||{});if(!list.length)return {};
  const w=wxNow();
  let ch=cfg().mutWildPct*(hasTag(n,"Glimmer")?2:1)*(w==="Rán's Temper"?2:1)+(w==="Doldrums"?2:0);
  const out={};
  const guaranteed=first&&(hasTag(n,"Rán's Net")||sisterOf(n)==="Dröfn");
  let avail=shuffle(list);
  if(guaranteed){const m=avail.shift();out[m]=S.mutations[m];ch/=4}
  for(const m of avail){if(Math.random()*100<ch){out[m]=S.mutations[m];ch/=4}else break}
  return out;
}
function rollBuds(n,s,first){
  const w8=sisterOf(n);
  let b=w8==="Dúfa"?rint(3,18):rint(6,12);
  if(hasTag(n,"Trench"))b+=3;
  if(hasTag(n,"Rán's Net"))b+=2;
  if(w8==="Hefring")b+=3;
  if(wxNow()==="Gale")b+=2;
  b+=eff("plantBuds");
  for(const c of s.colors)b+=eff("color"+c);
  if(first&&hasTag(n,"Shark Run"))b=Math.max(10,b);
  return b;
}
function discoverStrain(id){
  if(S.codex.found[id])return;
  S.codex.found[id]=S.clock.day;const s=ST(id);
  addLog(`Codex — new entry: ${s.name} (${affName(s.colors)}, ${kwText(s)}).`);ev("discover",{name:s.name,colors:s.colors});
  gainXP(5+eff("codexXP"),"new Codex entry");
  const pp=eff("codexPP");if(pp){S.pp+=pp;addLog(`+${pp} Perk Points (Codex Cartographer).`)}
  toast(`New strain in the Codex: ${s.name}!`);
}
function harvest(){
  const n=nodeById(S.location);if(!n||n.left<=0)return;
  if(!DB.strains.length){toast("Load strains.json first (Settings).");return}
  if(tankUsed()>=tankCap()){toast("The harvest tanks are full — head home to load the drying racks.");return}
  const w8=sisterOf(n),hef=w8==="Hefring";
  act(plantTime(n),()=>{
    n.left--;gainXP(hef?2:1,"harvested a plant");
    const first=!n.firstDone;n.firstDone=true;
    if(first)rollChest(n);
    const plants=[{first}];
    if(first&&w8==="Himinglæva")plants.push({first:false,twin:true});
    let strainId=null;
    for(const p of plants){
      const r=p.twin?{id:strainId,discovery:false}:rollStrain(n,p.first);if(!r)continue;strainId=r.id;
      const s=ST(r.id);if(r.discovery)discoverStrain(r.id);
      const buds=rollBuds(n,s,p.first),muts=rollMutations(n,p.first);
      const lot={strain:r.id,buds,muts,seep:hasTag(n,"Mana Seep"),hronn:w8==="Hrönn",plankton:wxNow()==="Plankton Bloom",day:S.clock.day};
      const kept=addToTank(lot);
      S.lastPlant=kept===buds?{strain:r.id,buds,muts,lot:(S.tank.find(l=>sameLot(l,lot))||{}).id,node:n.id}:null;
      const what=`${s.name}${Object.keys(muts).length?` (${mutPlain(muts)})`:""} — ${plural(buds,"bud")}`;
      ev("plant",{name:s.name,buds,kept,muts:mutPlain(muts),twin:!!p.twin,discovery:r.discovery});
      if(p.twin)addLog("Himinglæva grins — the first plant comes with a twin.");
      if(kept<buds){addLog(`Harvested ${what}, but only ${kept} fit in the tanks.`);toast(`Tanks full — kept ${kept} of ${buds} buds.`)}
      else{addLog(`Harvested ${what}.`);if(!r.discovery)toast(`Harvested ${what}.`)}
    }
    const coin=(p,lo,hi,why,plus=0)=>{if(Math.random()<p){let v=rint(lo,hi)+plus;const st=eff("seaTrader");if(st)v=r2(v*(1+st/100));money(v,why);addLog(`${why}: +${cr(v)}.`);ev("coins",{amount:v,why})}};
    if(hasTag(n,"Coin Scatter"))coin(.2,1,10,"Loose coins from old spilled cargo",setBonus("coinScatterCr"));
    if(w8==="Bylgja")coin(.3,5,15,"Party leftovers from Bylgja");
    if(w8==="Uðr"&&!S.gossip){S.gossip=true;addLog("Uðr won't stop talking — but she lets slip that one of your factions will definitely send an order tomorrow.")}
    const hits=[];if(hasTag(n,"Storm Front"))hits.push(3);if(HULL_DMG_PLANT[wxNow()])hits.push(HULL_DMG_PLANT[wxNow()]);
    const sank=hits.length&&hullHit(hits,[hasTag(n,"Storm Front")?"Storm Front":null,HULL_DMG_PLANT[wxNow()]?wxNow():null].filter(Boolean).join(" and "));
    if(n.left<=0){
      if(n.chest&&!sank){const C=CHESTS[n.chest.size];
        if(chestHoldUsed()+C.space<=chestHoldCap()){S.chestHold.push({id:nid("c"),size:n.chest.size,planar:n.chest.planar});spendTime(10);gainXP(2,"hoisted a chest");addLog(`On the way up, Finn hooks the ${C.label.toLowerCase()} to the winch and hoists it aboard (10 min).`);ev("hoist",{size:n.chest.size})}
        else addLog(`The ${C.label.toLowerCase()} won't fit in the chest hold — Finn leaves it for the sea.`);n.chest=null}
      S.nodes=S.nodes.filter(x=>x!==n);
      if(!sank){S.location="sea";S.pos={x:n.x,y:n.y};UI.selNode=null}
      if(hasTag(n,"Echoing")&&!n.echo){S.echoQueue=S.echoQueue||[];S.echoQueue.push({tags:n.tags.filter(t=>t!=="Echoing"),wave:n.wave,x:n.x,y:n.y,echo:true});addLog("The node fades — but it hums like it'll be back tomorrow.")}
      else addLog("The node fades. A new one will appear tomorrow.");
    }
  },"Harvested a plant by hand");
}
function sameLot(a,b){return a.strain===b.strain&&mutKey(a.muts)===mutKey(b.muts)&&!!a.seep===!!b.seep&&!!a.hronn===!!b.hronn&&!!a.plankton===!!b.plankton}
function addToTank(lot){
  const room=Math.max(0,tankCap()-tankUsed()),k=Math.min(room,lot.buds);if(!k)return 0;
  const same=S.tank.find(l=>sameLot(l,lot));

function dumpTank(id){

}

function dryDays(lot){
  const s=ST(lot.strain);let d=DRY_DAYS[rarityOf(s)]||1;
  if(lot.seep)d=Math.ceil(d/2);
  if(lot.hronn)d-=1;
  if(lot.plankton)d+=1;
  if(S.est[lot.strain]&&S.est[lot.strain].done)d-=eff("tidewright");
  return Math.max(1,d);
}
function loadRacks(){ // wet buds from the tanks onto any rack space; what doesn't fit waits in the tanks
  syncRacks();
  const cap=rackCap(),n=rackCount();let loaded=0;
  for(const lot of S.tank.slice()){
    for(let i=0;i<n&&lot.buds>0;i++){const r=S.racks[i],room=cap-rackUsed(r);if(room<=0)continue;
      const k=Math.min(room,lot.buds);r.push({...lot,id:nid("d"),buds:k,daysLeft:dryDays(lot)});lot.buds-=k;loaded+=k}
  }
  S.tank=S.tank.filter(l=>l.buds>0);
  const left=tankUsed();
  if(loaded)addLog(`Loaded ${plural(loaded,"wet bud")} onto the drying racks.${left?` ${plural(left,"bud")} wait in the tanks for rack space.`:""}`);
  else if(left)addLog(`The drying racks are full — ${plural(left,"wet bud")} wait in the harvest tanks.`);
  return {loaded,left};
}
function loadRacksNow(){if(!atHome()||!S.tank.length)return;act(0,()=>{loadRacks()},null)}
function storeDried(lot){ // fresh from the racks: into the Humidor if there's room, otherwise loose on the counter
  const base={strain:lot.strain,muts:lot.muts||{},fresh:100};
  const room=Math.max(0,humidorCap()-humidorUsed()),inH=Math.min(room,lot.buds),out=lot.buds-inH;
  if(inH)addHumidor({...base,buds:inH});
  if(out)S.loose.push({...base,id:nid("l"),buds:out,grace:cfg().freshGrace+eff("freshDays")});
  return {inH,out};
}
function addHumidor(lot){
  const same=S.humidor.find(l=>l.strain===lot.strain&&mutKey(l.muts)===mutKey(lot.muts)&&l.fresh===lot.fresh);
  if(same)same.buds+=lot.buds;else S.humidor.push({...lot,id:nid("h")});
}
function looseToHumidor(id){
  const l=S.loose.find(x=>x.id===id);if(!l)return;
  if(!atHome()){toast("The Humidor is at home.");return}
  const room=humidorCap()-humidorUsed();if(room<=0){toast("The Humidor is full.");return}
  const k=Math.min(room,l.buds);
  act(0,()=>{addHumidor({strain:l.strain,muts:l.muts,fresh:l.fresh,buds:k});l.buds-=k;if(l.buds<=0)S.loose=S.loose.filter(x=>x!==l)},`Stored ${plural(k,"bud")} of ${ST(l.strain).name} in the Humidor (freshness ${l.fresh}% locked)`);
}
function discardLot(where,id){
  const list=where==="humidor"?S.humidor:S.loose,l=list.find(x=>x.id===id);if(!l)return;
  if(!confirm(`Throw out ${plural(l.buds,"bud")} of ${ST(l.strain).name}?`))return;

}
function nightlyDrying(){
  const notes=[];syncRacks();
  let racksOn=0,done=[];
  for(const r of S.racks){if(!r.length)continue;racksOn++;
    for(const l of r){l.daysLeft--;if(l.daysLeft<=0)done.push(l)}
    for(const l of done)if(r.includes(l))r.splice(r.indexOf(l),1)}
  if(racksOn){const c=r2(racksOn*cfg().dryMana*manaMult());const p=Math.min(c,Math.max(0,S.credits));if(p>0)money(-p,`Metered Mana — ${plural(racksOn,"drying rack")} overnight`)}
  syncRacks();

/* ================================================================
   TIDE POOL — whole plants, crossing, Established strains, mutations
   ================================================================ */
const poolCap=()=>cfg().poolCap;
const canParent=s=>s&&!s.colorless&&(isMono(s)||(S.est[s.id]&&S.est[s.id].done));
const harvestable=s=>s&&(s.colorless||isMono(s)||(S.est[s.id]&&S.est[s.id].done));
function keepWhole(){ // turn the plant just harvested back into a live plant for the tide pool
  const lp=S.lastPlant;if(!lp||lp.kept)return;
  const lot=S.tank.find(l=>l.id===lp.lot);
  if(!lot||lot.buds<lp.buds){toast("That plant's buds have already moved on.");return}
  lot.buds-=lp.buds;if(lot.buds<=0)S.tank=S.tank.filter(l=>l!==lot);
  S.tankPlants.push({id:nid("tp"),strain:lp.strain,buds:lp.buds,muts:deep(lp.muts||{})});lp.kept=true;
  addLog(`Kept the ${ST(lp.strain).name} plant whole for the tide pool. It rides home in the tanks.`);ev("keep",{name:ST(lp.strain).name});commit();
}
function plantsToPool(){ // on docking: live plants into the tide pool while there's room
  let moved=0;
  for(const p of S.tankPlants.slice()){if(S.pool.length>=poolCap())break;S.pool.push({id:nid("pp"),strain:p.strain,buds:p.buds,muts:p.muts||{},from:"sea"});S.tankPlants=S.tankPlants.filter(x=>x!==p);moved++}
  if(moved)addLog(`Settled ${plural(moved,"plant")} into the tide pool.${S.tankPlants.length?` ${plural(S.tankPlants.length,"plant")} wait in the tanks — the pool is full.`:""}`);
  return moved;
}
function recipeFor(a,b){return DB.strains.find(s=>s.recipe&&((s.recipe[0]===a&&s.recipe[1]===b)||(s.recipe[0]===b&&s.recipe[1]===a)))||null}
const jeffHere=()=>S.jeffDay===S.clock.day;
const crossTime=()=>Math.max(5,30-eff("crossTime"));
function crossCheck(a,b){
  if(!a||!b||a===b)return "Pick two different plants.";
  const A=ST(a.strain),B=ST(b.strain);
  if(A.colorless||B.colorless)return "Colorless plants are dead ends — they can't be crossed.";
  if(!canParent(A))return `${A.name} isn't Established yet, so it can't be a parent.`;
  if(!canParent(B))return `${B.name} isn't Established yet, so it can't be a parent.`;
  if(A.colors.length===B.colors.length&&A.colors.every(c=>B.colors.includes(c)))return "Crossing two strains of the same colors adds nothing.";
  return null;
}
function rollCrossMutation(){
  let ch=cfg().mutCrossPct+eff("crossMut")+(eff("sharkSupervisor")&&jeffHere()?1:0);
  const out={};let avail=shuffle(Object.keys(MUTATIONS));
  for(const m of avail){if(Math.random()*100<ch){out[m]=1;ch/=4}else break}
  // each hit adds a mutation to her list, or raises one she has a tier (max III)
  const res={};
  for(const m of Object.keys(out)){
    if(!S.mutations[m]){S.mutations[m]=1;addLog(`Codex — new mutation: ${m}. ${MUTATIONS[m]}.`);ev("mutation",{name:m,tier:1});gainXP(10,"discovered a mutation");gainXP(5+eff("codexXP"),"new Codex entry");const pp=eff("codexPP");if(pp)S.pp+=pp;toast(`New mutation discovered: ${m}!`)}
    else if(S.mutations[m]<3){S.mutations[m]++;addLog(`${m} rose to tier ${ROMAN[S.mutations[m]]} — every wild ${m} plant gets it too.`);ev("mutation",{name:m,tier:S.mutations[m]})}
    res[m]=S.mutations[m];
  }
  return res;
}
function cross(aId,bId){
  if(!atHome()){toast("The tide pool is at the foot of the cliff — head home first.");return}
  const a=S.pool.find(p=>p.id===aId),b=S.pool.find(p=>p.id===bId),why=crossCheck(a,b);
  if(why){toast(why);return}
  act(crossTime(),()=>{
    S.pool=S.pool.filter(p=>p!==a&&p!==b);{const x=(S.crossXPFrac||0)+2*(1+setBonus("crossXP")/100),g=Math.floor(x+1e-9);S.crossXPFrac=r2(x-g);gainXP(g,"crossed two plants")}
    const r=recipeFor(a.strain,b.strain),muts=rollCrossMutation(),jeff=eff("sharkSupervisor")&&jeffHere();
    if(!r){
      const pool=DB.strains.filter(s=>s.colorless);if(!pool.length){addLog("The cross took, but nothing grew.");return}
      const c=pick(pool);if(!S.codex.found[c.id])discoverStrain(c.id);
      S.pool.push({id:nid("pp"),strain:c.id,buds:rint(6,12),muts,from:"cross"});
      addLog(`Crossed ${ST(a.strain).name} × ${ST(b.strain).name}: no recipe — a Colorless ${c.name} plant. A dead end, but its buds sell.`);
      ev("cross",{a:ST(a.strain).name,b:ST(b.strain).name,child:c.name,recipe:false,muts:mutPlain(muts)});return;
    }
    const e=S.est[r.id]=S.est[r.id]||{progress:0,done:false,crosses:0};
    if(!S.codex.recipes[r.id]){S.codex.recipes[r.id]=S.clock.day;addLog(`New recipe: ${ST(a.strain).name} × ${ST(b.strain).name} → ${r.name}.`);gainXP(10,"discovered a new recipe");if(!S.codex.found[r.id])discoverStrain(r.id)}
    e.crosses++;
    let note;
    if(!e.done){
      e.progress=Math.min(100,e.progress+cfg().crossPct+eff("crossProgress")+(jeff?5:0));
      if(e.progress>=100){e.done=true;e.spread=3;e.estDay=S.clock.day;e.since=0;
        addLog(`${r.name} is Established! It enters the wild as Scarce and can be sold. This cross's child stays in the pool.`);ev("established",{name:r.name});gainXP(20,"a strain became Established");toast(`${r.name} is Established!`);
        S.pool.push({id:nid("pp"),strain:r.id,buds:rint(6,12),muts,from:"cross"});note="Established";}
      else note=`${e.progress}% toward Established — the child goes back to the sea`;
    }else{
      e.since=(e.since||0)+1;
      const floor=SPREAD_FLOOR[tierOf(r)];
      if(e.since>=5&&e.spread>floor){e.spread--;e.since=0;addLog(`${r.name} spreads wider in the wild: now ${SPREADS[e.spread]}.`);ev("spread",{name:r.name,spread:SPREADS[e.spread]})}
      S.pool.push({id:nid("pp"),strain:r.id,buds:rint(6,12),muts,from:"cross"});note="a new plant for the pool";
    }
    addLog(`Crossed ${ST(a.strain).name} × ${ST(b.strain).name} → ${r.name} (${note})${Object.keys(muts).length?`, with ${mutPlain(muts)}`:""}.${jeff?" Jeff supervised.":""}`);
    ev("cross",{a:ST(a.strain).name,b:ST(b.strain).name,child:r.name,recipe:true,note,muts:mutPlain(muts)});
  },null);
}
function harvestPool(id){
  const p=S.pool.find(x=>x.id===id);if(!p)return;
  if(!atHome()){toast("Head home first.");return}
  const s=ST(p.strain);if(!harvestable(s)){toast(`${s.name} isn't Established yet — nothing from it can be sold.`);return}

/* ================================================================
   ORDERS — jars, cartridges, pens and refills
   ================================================================ */
function matches(req,id){
  const s=ST(id);if(!s)return false;
  if(!req)return true;                       // "any strain"
  if(s.colorless)return false;
  if(req.type==="strain")return id===req.strain;
  if(req.type==="aff")return s.colors.length===req.colors.length&&req.colors.every(c=>s.colors.includes(c));
  if(req.type==="kw")return s.keywords.some(k=>k.k===req.k&&k.x>=req.min);
  return false;
}
function reqText(req,plain){
  if(!req)return plain?"any strain":"<b>any strain</b>";
  if(req.type==="strain"){const s=ST(req.strain);return plain?(s?s.name:req.strain):strainTxt(req.strain,{kw:true})}
  if(req.type==="aff")return plain?`any ${affName(req.colors)} strain`:`${pips(req.colors)} any <b>${affName(req.colors)}</b> strain`;
  if(req.type==="kw")return plain?`any strain with ${req.k} ${req.min} or higher`:`any strain with <b>${esc(req.k)} ${req.min}</b> or higher`;
  return "";
}
function masteryBonus(id){return (S.mastery[id]||0)>=5?1.05:1}
function budPrice(id,muts){
  const s=ST(id);if(!s)return 0;
  const tiers=Object.values(muts||{}).reduce((a,b)=>a+b,0);
  let p=s.price*(1+tiers*(10+eff("collectorsEye"))/100);
  if(tiers)p*=1+eff("wavecatcher")/100;
  return p*masteryBonus(id);
}
function cheapestFor(req){
  const pool=req?DB.strains.filter(s=>!s.colorless&&matches(req,s.id)):orderPool();
  const c=pool.slice().sort((a,b)=>a.price-b.price)[0];return c?c.id:null;
}
const flavorFee=f=>!f?0:(f===HOUSE_BLEND?8+setBonus("blendCr"):5)+eff("houseBlend");
const cartUnit=(id,muts,fresh,flavor)=>3*budPrice(id,muts)*fresh/100+2+flavorFee(flavor);
const budsPerCart=()=>eff("concentrate")?2:3;
const itemReq=it=>it.kind==="pen"?it.cart.req:it.req;
const itemFlavor=it=>it.kind==="pen"?it.cart.flavor:it.flavor;
const namedParts=it=>Object.values(it.spec||{}).filter(Boolean).length;
const cartOf=it=>it.kind==="pen"?(it.fill&&it.fill.cart):it.fill;
function itemDone(it){return it.kind==="pen"?!!(it.fill&&it.fill.done):!!it.fill}
const prefMet=it=>!!(it.pref&&cartOrLot(it)&&(cartOrLot(it).muts||{})[it.pref]);
const cartOrLot=it=>it.kind==="pen"?(it.fill&&it.fill.cart):it.fill;
function itemPrice(it,live){
  const f=live?cartOrLot(it):null,id=f?f.strain:cheapestFor(itemReq(it)),muts=f?f.muts:{},fresh=f?f.fresh:100;
  if(!id)return 0;
  let p;
  if(it.kind==="jar"){const J=JARS[it.size];p=J.buds*budPrice(id,muts)*fresh/100+J.price}

/* ---------- generation ---------- */
function pickClient(f){

  const c=wpick([...orgs.map(o=>[{o},2]),...people.map(p=>[{p},1])]);
  if(!c)return {who:pick(f.who),planes:[]};
  if(c.o)return {who:c.o.name,planes:c.o.planes||[]};
  const org=c.p.org&&orgs.find(o=>o.id===c.p.org);
  return {who:c.p.name+(c.p.title?`, ${c.p.title}`:"")+(org?` of ${org.name}`:""),planes:(c.p.planes&&c.p.planes.length)?c.p.planes:(org?org.planes:[])};
}
function orderPool(){return DB.strains.filter(s=>!s.colorless&&(isMono(s)||(S.est[s.id]&&S.est[s.id].done)))}
const facW=(f,s)=>s.colors.reduce((a,c)=>a+(f.colors[c]||1),0)/s.colors.length*(f.key==="reg"?s.colors.length:1);
function genReq(f){
  const pool=orderPool();if(!pool.length)return null;
  const type=wpick(f.key==="reg"?{strain:6,aff:2,kw:1}:{strain:5,aff:3,kw:3});
  if(type==="aff"){
    const sets={};for(const s of pool){const k=s.colors.join("");sets[k]=sets[k]||{colors:s.colors,w:facW(f,s)}}
    const k=wpick(Object.entries(sets).map(([k,v])=>[k,v.w]));return {type:"aff",colors:sets[k].colors};
  }
  if(type==="kw"){
    const present=new Set(pool.flatMap(s=>s.keywords.map(k=>k.k)));
    let kws=f.keywords.filter(k=>present.has(k));if(!kws.length)kws=[...present];
    const k=pick(kws),maxX=Math.max(...pool.flatMap(s=>s.keywords.filter(x=>x.k===k).map(x=>x.x)));
    return {type:"kw",k,min:wpick(Array.from({length:maxX},(_,i)=>[i+1,maxX-i]))};

function genFlavor(f,chance){

function overnight(){
  const notes=[];
  if(!atHome()){S.location="home";S.pos=null;loadRacks();plantsToPool();const c=unloadChests();notes.push("Finn sailed home and loaded the racks"+(c?` and unloaded ${plural(c,"chest")}`:"")+".")}
  S.lastPlant=null;
  const oldMonth=monthOf(S.clock.day);
  notes.push(...nightlyDrying());
  S.clock.day++;S.clock.min=420;
  {const before=S.hull;S.hull=Math.min(maxHull(),S.hull+hullRepair());if(S.hull>before&&before<maxHull())notes.push(`Hull repaired overnight: ${S.hull}/${maxHull()}.`)}
  if(S.boatOutUntil!=null&&S.clock.day===S.boatOutUntil+1){notes.push("The Lucky Landshark is back in the water.");S.boatOutUntil=null}
  ensureWeather();{const w=wxNow();ev("weather",{w});notes.push(`Weather: ${wxIcon(w)} ${w}.`)}
  if(Math.random()*100<cfg().jeffPct){S.jeffDay=S.clock.day;notes.push("Jeff is napping by the tide pool today.")}
  notes.push(...nightlyDeliveries());
  const before=S.offers.length;for(const o of S.offers)if(o.expires<S.clock.day)ev("expire",evO(o));S.offers=S.offers.filter(o=>o.expires>=S.clock.day);
  if(before-S.offers.length)notes.push(`${plural(before-S.offers.length,"offer")} expired.`);
  for(const o of S.orders)if(o.urgent&&!o.missed&&S.clock.day>o.deadline){o.missed=true;ev("missed",evO(o));notes.push(`Missed the deadline on ${o.title} — no urgency fee, no RP.`)}
  notes.push(...nightlyPens());
  notes.push(...nightlyAuctions());
  notes.push(...runPayroll());
  notes.push(...payTow());
  const nm=monthOf(S.clock.day);
  if(nm!==oldMonth){
    notes.push(`${monthName(S.clock.day)} begins.`);
    notes.push(...closeMonth(monthName(S.clock.day-1)));
    if(S.lives<livesCap()){S.lives++;notes.push("A Phoenix Feather arrived for the new month.")}else notes.push("The monthly feather was lost — already at the cap.");
    for(const f of FACTIONS){const st=S.factions[f.key];if(!st.registered)continue;
      if(st.autoRenew&&canPay(duesFor(f.key))){money(-duesFor(f.key),`${f.name} registration (${monthName(S.clock.day)}, Level ${st.level})`)}
      else{st.registered=false;st.autoRenew=false;notes.push(`Registration with ${f.name} lapsed.`)}}
    const up=Math.min(cfg().upkeep,Math.max(0,S.credits));
    if(up>0)money(-up,`Boat upkeep — The Lucky Landshark (${monthName(S.clock.day)})`);
    if(up<cfg().upkeep)notes.push(`The business could only cover ${cr(up)} of the ${cr(cfg().upkeep)} boat upkeep.`);
  }
  notes.push(...payPermits(false));
  let got=0;
  const regd=FACTIONS.filter(f=>S.factions[f.key].registered),tip=S.gossip&&regd.length?pick(regd).key:null;S.gossip=false;
  for(const f of FACTIONS){const st=S.factions[f.key];if(!st.registered)continue;
    const ch=orderChance(f.key);let n=Math.floor(ch/100);if(Math.random()*100<ch%100)n++;
    if(f.key===tip&&n<1){n=1;notes.push(`Uðr was right — the ${f.name} sent an order.`)}
    for(let i=0;i<n;i++){const o=genOrder(f);if(!o)continue;S.offers.push(o);ev("offer",{...evO(o),expires:o.expires});got++}}
  if(got)notes.push(`${plural(got,"new order offer")} arrived.`);
  const had=S.nodes.length;fillNodes();if(S.nodes.length>had)notes.push(`${plural(S.nodes.length-had,"new node")} glow${S.nodes.length-had>1?"":"s"} on the water.`);
  return notes;
}
function jumpDate(iso,simulate){
  if(!iso){toast("Pick a date first.");return}
  const target=dnOf(iso),from=S.clock.day;
  if(target===from){toast("That's already today.");return}
  if(simulate){
    if(target<from){toast("Simulation only runs forward. Use Jump to go back.");return}
    const n=target-from;
    if(n>400){toast("That's over 400 days — jump without simulating, or pick a closer date.");return}
    if(!confirm(`Simulate ${plural(n,"night")}? Racks dry, offers expire, dues get charged, orders roll and nodes refresh for each day.`))return;
    let offers=0;
    for(let i=0;i<n;i++){const notes=overnight();for(const t of notes)if(t.includes("new order offer"))offers+=parseInt(t)||0}
    addLog(`— Simulated ${plural(n,"night")} from ${fmtDate(from)} to ${fmtDate(S.clock.day)}. ${plural(offers,"order offer")} rolled along the way; ${S.offers.length} still open.`);
    toast(`Simulated to ${fmtDate(S.clock.day)}.`);
  }else{
    if(!confirm(`Jump to ${fmtDate(target)} without simulating? Nothing happens for the skipped days — racks don't dry, no dues, lives, rolls or expiries.`))return;
    S.clock.day=target;S.clock.min=420;ensureWeather();
    addLog(`— Date set to ${fmtDate(target)} (jumped ${target>from?"forward":"back"} ${plural(Math.abs(target-from),"day")}, no simulation).`);
  }
  commit();
  if(GH.ready()&&GH.mode()!=="manual")GH.pushSave();
}

function setStrains(j){DB.strains=j.strains||j;DB.keywords=j.keywords||DB.keywords||{};DB.strainMap=Object.fromEntries(DB.strains.map(s=>[s.id,s]));if(S)ensureStarters()}

const ICON_MIME={svg:"image/svg+xml",png:"image/png",jpg:"image/jpeg",jpeg:"image/jpeg",webp:"image/webp",gif:"image/gif"};
const PLACEHOLDER_ICON="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="10" fill="#ece6f5"/><circle cx="32" cy="32" r="22" fill="none" stroke="#b9a2e0" stroke-width="3" stroke-dasharray="4 5"/><text x="32" y="43" text-anchor="middle" font-family="Georgia,serif" font-size="32" font-weight="700" fill="#5a3a86">?</text></svg>');
const iconSrc=d=>(d&&d.icon&&ICONS[d.icon])||PLACEHOLDER_ICON;
const LS={save:"fgw.save",gh:"fgw.gh",db:"fgw.db",dirty:"fgw.dirty",synced:"fgw.syncedAt",sha:"fgw.saveSha",icons:"fgw.iconCache",theme:"fgw.theme"};
function lsGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){console.warn(e);return false}}
let ICON_SHA={};
function saveIcons(){
  const pack={};for(const f in ICONS)pack[f]={uri:ICONS[f],sha:ICON_SHA[f]||null};
  if(!lsSet(LS.icons,pack)){try{localStorage.removeItem(LS.icons)}catch(e){}console.warn("Card icons too large to cache in this browser; they will re-download each visit.")}
}
function loadIconCache(){ICONS={};ICON_SHA={};const pack=lsGet(LS.icons,{});for(const f in pack){ICONS[f]=pack[f].uri;ICON_SHA[f]=pack[f].sha}}
function saveDB(){lsSet(LS.db,{strains:DB.strains,keywords:DB.keywords,factions:DB.factions,planes:DB.planes,cards:DB.cards,cardCredits:DB.cardCredits,sets:DB.sets})}
let syncState="off",syncMsg="Not connected",pushTimer=null;
function saveLocal(dirty){lsSet(LS.save,S);if(dirty){lsSet(LS.dirty,true);if(GH.ready()){syncState="dirty";syncMsg="Unsynced changes";if(GH.mode()==="change"){clearTimeout(pushTimer);pushTimer=setTimeout(()=>GH.pushSave(),12000)}}}}
const b64enc=s=>{const b=new TextEncoder().encode(s);let bin="";for(let i=0;i<b.length;i+=0x8000)bin+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(bin)};
const b64dec=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,"")),c=>c.charCodeAt(0)));
const GH={
  cfg(){return lsGet(LS.gh,null)},
  ready(){const c=this.cfg();return !!(c&&c.owner&&c.repo&&c.token)},
  mode(){return (this.cfg()||{}).mode||"change"},
  url(path,withRef){const c=this.cfg();return `https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/contents/${path}`+(withRef?`?ref=${encodeURIComponent(c.branch||"main")}`:"")},
  headers(){return {Authorization:"Bearer "+this.cfg().token,Accept:"application/vnd.github+json","X-GitHub-Api-Version":"2022-11-28"}},
  async get(path){
    const r=await fetch(this.url(path,true),{headers:this.headers(),cache:"no-store"});
    if(r.status===404)return null;
    if(!r.ok)throw new Error(`GitHub ${r.status} reading ${path}: ${(await r.text()).slice(0,140)}`);
    const j=await r.json();
    let text;
    if(j.content&&j.encoding==="base64")text=b64dec(j.content);
    else{const r2=await fetch(this.url(path,true),{headers:{...this.headers(),Accept:"application/vnd.github.raw+json"},cache:"no-store"});text=await r2.text()}
    return {data:JSON.parse(text),sha:j.sha};
  },
  async getFile(path){
    const r=await fetch(this.url(path,true),{headers:this.headers(),cache:"no-store"});
    if(r.status===404)return null;if(!r.ok)throw new Error(`GitHub ${r.status} reading ${path}`);
    const j=await r.json(),ext=(path.split(".").pop()||"").toLowerCase();
    let b64=(j.content||"").replace(/\s/g,"");
    if(!b64){const r2=await fetch(this.url(path,true),{headers:{...this.headers(),Accept:"application/vnd.github.raw+json"},cache:"no-store"});const buf=new Uint8Array(await r2.arrayBuffer());let bin="";for(let i=0;i<buf.length;i+=0x8000)bin+=String.fromCharCode.apply(null,buf.subarray(i,i+0x8000));b64=btoa(bin)}
    return `data:${ICON_MIME[ext]||"application/octet-stream"};base64,${b64}`;
  },
  async loadIcons(){
    const r=await fetch(this.url("card-icons",true),{headers:this.headers(),cache:"no-store"});
    const list=r.ok?await r.json():[];const remote={};
    if(Array.isArray(list))for(const f of list)if(f.type==="file")remote[f.name]=f.sha;
    DB.iconMissing=[];

      if(!remote[f]){if(!ICONS[f])DB.iconMissing.push(f);continue}
      if(ICONS[f]&&ICON_SHA[f]===remote[f])continue;
      try{const u=await this.getFile("card-icons/"+f);if(u){ICONS[f]=u;ICON_SHA[f]=remote[f]}}catch(e){console.warn(e)}
    }
    saveIcons();
  },
  async put(path,data,sha,message){
    const c=this.cfg();

  },
  async loadDBs(){

    if(st)setStrains(st.data);

  async pullSave(force){

    }

  },
  async pushSave(){
    if(!this.ready())return;

    if(this.busy){this.again=true;return}
    this.busy=true;
    try{await this._push()}finally{this.busy=false}

  },
  async _push(){
    syncState="busy";syncMsg="Saving to GitHub…";renderStatus();

      let sha=lsGet(LS.sha,null);

      catch(e){

        }else throw e;
      }

  },
};

  const prog=Object.entries(S.est).map(([id,e])=>[ST(id),e]).filter(([s])=>s).sort((a,b)=>a[1].done-b[1].done||a[0].colors.length-b[0].colors.length);

/* ---------- ORDERS ---------- */
function srcPicker(o,i,req,need){
  const c=sources(req,need);
  return c.length?`<select data-src="${o.id}" data-i="${i}" style="max-width:100%">${c.map(x=>`<option value="${x[0]}:${x[1].id}">${esc(srcLabel(x))}</option>`).join("")}</select>`:null;
}
const flavorLine=f=>f?`flavored <b>${esc(f)}</b>`:"no flavor";
function itemHTML(o,it,i,offer){
  const working=!offer&&o.stage==="filling";let body="",reqLine="";
  if(it.kind==="jar"){
    reqLine=reqText(it.req);
    if(working&&!it.fill){const J=JARS[it.size],pk=srcPicker(o,i,it.req,J.buds),have=bin(it.size);
      body=pk?`<div class="row">${pk}<button class="btn sm brass" data-act="jar" data-o="${o.id}" data-i="${i}" ${atHome()&&have?"":"disabled"}>Jar it (${fmtDur(jarTime(it.size))})</button></div>${have?"":`<div class="tiny cr-minus">No empty ${J.label.toLowerCase()}s — order some from Hallmark's.</div>`}`
        :`<span class="muted tiny">Nothing dried matches yet — ${J.buds} buds needed.</span>`}
    if(it.fill)body=`<div class="row between"><span class="small">Sealed: ${strainTxt(it.fill.strain)} ${mutTxt(it.fill.muts)} · ${it.fill.fresh}% fresh</span>${working?`<a href="#" class="small muted" data-act="unjar" data-o="${o.id}" data-i="${i}">Unpack</a>`:""}</div>`;
  }else if(it.kind==="cart"||it.kind==="refill"){
    reqLine=`${reqText(it.req)} · ${flavorLine(it.flavor)}`;
    if(working&&!it.fill)body=cartFiller(o,it,i);
    if(it.fill)body=`<span class="small">${it.kind==="refill"?"Refilled":"Filled"}: ${strainTxt(it.fill.strain)} ${mutTxt(it.fill.muts)} · ${it.fill.fresh}% fresh${it.fill.flavor?` · ${esc(it.fill.flavor)}`:""}</span>`;
  }else{
    const spec=Object.entries(it.spec||{}).filter(([,v])=>v).map(([k,v])=>partLabel(partKey(k,v)));
    reqLine=`${spec.length?`${esc(spec.join(", "))} <span class="tiny muted">(+2 Cr each)</span>`:`<span class="muted">any ${it.tier} parts</span>`}<div class="small" style="margin-top:2px">Included cartridge: ${reqText(it.cart.req)} · ${flavorLine(it.cart.flavor)}</div>`;
    if(working){
      if(!it.fill)body=`<div class="tiny muted" style="margin-bottom:3px">1. Fill the cartridge</div>${cartFiller(o,it,i)}`;
      else if(!it.fill.done){
        const c=it.fill.cart;
        body=`<div class="small">✓ Cartridge: ${strainTxt(c.strain)} · ${c.fresh}%${c.flavor?` · ${esc(c.flavor)}`:""}</div><div class="tiny muted" style="margin:4px 0 3px">2. Assemble</div><div class="row">`+
         penKinds(it.tier).map(k=>{const opts=penOptions(it,k);const want=it.spec&&it.spec[k];
           if(!opts.length){const key=want?partKey(k,want):null;return `<span class="tiny cr-minus">No ${want?esc(partLabel(key).toLowerCase()):it.tier+" "+PART_KINDS[k].toLowerCase()}${key&&!isTooled(key)?` — <a href="#" data-act="tool" data-k="${esc(key)}">tool it</a>`:""}</span>`}
           return `<select data-part="${o.id}" data-i="${i}" data-kind="${k}">${opts.map(x=>`<option value="${esc(x)}">${esc(partLabel(x))} (${bin(x)})</option>`).join("")}</select>`}).join("")+
         `<button class="btn sm brass" data-act="assemble" data-o="${o.id}" data-i="${i}" ${atHome()&&bin("core")>0&&penKinds(it.tier).every(k=>penOptions(it,k).length)?"":"disabled"}>Assemble (${fmtDur(penTime(it.tier))})</button></div>${bin("core")?"":`<div class="tiny cr-minus">No mana cores.</div>`}`;
      }
    }
    if(it.fill&&it.fill.done)body=`<span class="small">✓ ${esc(Object.values(it.fill.parts).map(partLabel).join(", "))} · cartridge: ${esc(ST(it.fill.cart.strain).name)}${it.fill.cart.flavor?`, ${esc(it.fill.cart.flavor)}`:""}</span>`;
  }
  const pass=!offer&&itemDone(it);
  const pref=it.pref?`<span class="tag mut" title="Meeting it pays +${cfg().prefPct}% on this item">${esc(it.pref)} preferred${!offer&&cartOrLot(it)?(prefMet(it)?" ✓":" ✗"):""}</span>`:"";
  const lbl=it.kind==="jar"?`${JARS[it.size].label} · ${JARS[it.size].buds} buds`:it.kind==="cart"?`Cartridge · ${budsPerCart()} buds`:it.kind==="refill"?`Refill · returned cartridge`:`${PEN_TIERS[it.tier].label} pen`;
  return `<div class="slot ${pass?"pass":""}"><div class="row between"><span class="lbl">${lbl}</span><span class="row" style="gap:4px">${pref}${offer?"":pass?`<span class="tag ok">done</span>`:`<span class="tag no">open</span>`}</span></div>
   <div class="req">${reqLine}</div>${body?`<div style="margin-top:5px">${body}</div>`:""}</div>`;
}
function cartFiller(o,it,i){
  const req=itemReq(it),fl=itemFlavor(it),need=budsPerCart(),refill=it.kind==="refill",pk=srcPicker(o,i,req,need);

  return `<div class="row">${pk}<button class="btn sm brass" data-act="fillcart" data-o="${o.id}" data-i="${i}" ${atHome()&&okShell&&okFl?"":"disabled"}>${refill?"Refill":"Extract & fill"} (${fmtDur(extractTime())})</button></div>
   ${okShell?"":`<div class="tiny cr-minus">No cartridge shells — order some from Hallmark's.</div>`}${okFl?"":`<div class="tiny cr-minus">Out of ${esc(fl)} — order Flavor Solution from Hallmark's.</div>`}`;
}

      <div class="muted tiny">You keep ${cr(p.net)} after the ${cfg().referral}% referral and ${cfg().levyPct}% levy · ${rp} RP · ${5*rp} XP · +${Math.floor(p.pp)} PP</div></div>
      <div class="row">${btns}</div></div>

     ${o.stage==="filling"?`<div style="margin-top:6px"><a href="#" class="small muted" data-act="abandon" data-o="${o.id}">Cancel order</a></div>`:""}`;

  return `<article class="wo"><div class="wo-h"><div class="fac">${esc(f.name)}</div><h4>${esc(o.title)}</h4>

    ${o.line?`<p class="quote">“${esc(o.line)}”</p>`:""}</div>
    <div class="wo-b">${o.items.map((it,i)=>itemHTML(o,it,i,offer)).join("")}</div><div class="wo-f">${foot}</div></article>`;

/* ---------- CODEX ---------- */
function dbProblems(){
  const out=[],ids=new Set(),byId={};
  DB.strains.forEach((s,i)=>{byId[s.id]=s});
  DB.strains.forEach((s,i)=>{const w=`Strain ${s.id||"#"+(i+1)} (${s.name||"no name"})`;
    if(!s.id)out.push([w,"has no id"]);else if(ids.has(s.id))out.push([w,"shares its id with another strain"]);ids.add(s.id);
    if(!s.name)out.push([w,"has no name"]);
    if(!s.colorless){if(!Array.isArray(s.colors)||!s.colors.length||s.colors.some(c=>!COLORS[c]))out.push([w,`colors must be one to five of W, U, B, R, G (or "colorless": true)`]);
      else if(new Set(s.colors).size!==s.colors.length)out.push([w,"lists a color twice"])}
    if(!(s.price>0))out.push([w,"needs a price per bud"]);
    (s.keywords||[]).forEach(k=>{if(DB.keywords&&Object.keys(DB.keywords).length&&!DB.keywords[k.k])out.push([w,`keyword "${k.k}" isn't in the keyword glossary`]);if(!(k.x>=1))out.push([w,`${k.k} needs a strength of 1 or more`])});
    if(!(s.keywords||[]).length)out.push([w,"has no keywords"]);
    if(s.recipe){if(s.recipe.length!==2)out.push([w,"recipe needs exactly two parent ids"]);
      else s.recipe.forEach(p=>{if(!byId[p])out.push([w,`recipe parent "${p}" isn't a strain id`])});
      if(s.recipe.length===2&&byId[s.recipe[0]]&&byId[s.recipe[1]]&&s.colors){const u=new Set([...(byId[s.recipe[0]].colors||[]),...(byId[s.recipe[1]].colors||[])]);
        if(u.size!==s.colors.length||s.colors.some(c=>!u.has(c)))out.push([w,`its parents' colors combine to ${[...u].join("")}, not ${s.colors.join("")}`])}}
    else if(!s.colorless&&s.colors&&s.colors.length>1)out.push([w,"is multi-color but has no recipe"]);
  });
  const cids=new Set();
  (DB.cards||[]).forEach((c,i)=>{const w=`Card ${c.id||"#"+(i+1)} (${c.name||"no name"})`;
    if(!c.id)out.push([w,"has no id"]);else if(cids.has(c.id))out.push([w,"shares its id with another card"]);cids.add(c.id);
    if(!c.name)out.push([w,"has no name"]);
    const st=c.stats||[];if(!st.length||st.length>2||st.some(x=>!STATS.includes(x)))out.push([w,`stats must be one or two of insight, precision, renown`]);
    if(!CARD_RARITY_ODDS[c.rarity])out.push([w,`rarity "${c.rarity}" should be Common, Uncommon or Rare`]);
    if(!c.effect||!EFFECT_TEXT[c.effect.type])out.push([w,`effect type "${c.effect&&c.effect.type}" isn't one this page knows yet`]);
    if(c.signature&&(c.maxRank||1)!==1)out.push([w,"signature cards max at rank 1"]);
    if(!(c.maxRank>=1))out.push([w,"needs a maxRank of 1 or more"]);
    if(c.icon&&(DB.iconMissing||[]).includes(c.icon))out.push([w,`icon "${c.icon}" wasn't found in card-icons/`])});
  const sids=new Set(),iids=new Set();
  (DB.sets||[]).forEach((s,i)=>{const w=`Set ${s.id||"#"+(i+1)} (${s.name||"no name"})`;
    if(!s.id)out.push([w,"has no id"]);else if(sids.has(s.id))out.push([w,"shares its id with another set"]);sids.add(s.id);
    if(!["coins","books"].includes(s.type))out.push([w,`type should be "coins" or "books"`]);
    if(!s.bonus||!SET_BONUS_TYPES[s.bonus.type])out.push([w,`bonus type "${s.bonus&&s.bonus.type}" isn't one this page knows`]);
    if(!(s.items||[]).length)out.push([w,"has no items"]);
    (s.items||[]).forEach((it,j)=>{const w2=`${w}, item ${it.id||"#"+(j+1)}`;if(!it.id)out.push([w2,"has no id"]);else if(iids.has(it.id))out.push([w2,"shares its id with another Collectable"]);iids.add(it.id);
      if(!(it.value>0))out.push([w2,"needs a value"]);if(!it.name)out.push([w2,"has no name"])})});
  if(DB.factions){
    const planes=new Set(DB.planes||[]);
    for(const [k,f] of Object.entries(DB.factions)){
      if(!FAC[k]){out.push([`Faction "${k}"`,`isn't one of ${FACTIONS.map(x=>x.key).join(", ")}`]);continue}
      const oids=new Set();
      (f.organizations||[]).forEach(o=>{const w=`${FAC[k].name}: ${o.name||o.id}`;
        if(!o.id)out.push([w,"group has no id"]);else if(oids.has(o.id))out.push([w,"shares its id with another group"]);oids.add(o.id);
        if(!o.name)out.push([w,"group has no name"]);
        if(planes.size)(o.planes||[]).forEach(pl=>{if(!planes.has(pl))out.push([w,`plane "${pl}" isn't in the planes list (typo?)`])})});
      (f.people||[]).forEach(p=>{const w=`${FAC[k].name}: ${p.name||"unnamed person"}`;
        if(!p.name)out.push([w,"person has no name"]);
        if(p.org&&!oids.has(p.org))out.push([w,`links to group "${p.org}", which isn't in this faction`]);
        if(planes.size)(p.planes||[]).forEach(pl=>{if(!planes.has(pl))out.push([w,`plane "${pl}" isn't in the planes list (typo?)`])})});
    }
  }
  return out;
}
const MASTERY_ROMAN=["","I","II","III","IV","V"];
function strainCard(s){

  const sold=S.sold[s.id]||0,lv=S.mastery[s.id]||0,next=MASTERY[lv];
  const spread=spreadIdx(s);

   <div class="row" style="margin:3px 0">${rarTag(rarityOf(s))}<span class="tag">${tierOf(s)}</span>${spread>=0?`<span class="tag">${SPREADS[spread]}</span>`:""}<span class="small"><b>${cr(budPrice(s.id))}</b>/bud</span></div>
   <div class="small">${s.keywords.map(k=>`<span title="${esc((DB.keywords[k.k]||{}).text||"")}"><b>${esc(k.k)} ${k.x}</b></span>`).join(" · ")}</div>
   <div class="fl">“${esc(s.flavor||"")}”</div>
   ${s.recipe?`<div class="small" style="margin-top:4px">Recipe: ${S.codex.recipes[s.id]?`${esc(ST(s.recipe[0]).name)} × ${esc(ST(s.recipe[1]).name)}`:"<span class='muted'>unknown</span>"}${est&&!est.done?` · ${est.progress}% to Established`:""}</div>`:""}
   <div class="tiny muted" style="margin-top:4px">Inspired by ${esc(s.inspiredBy||"—")}${f?` · found ${fmtShort(f)}`:""}</div>

  P(`Weather (${seasonOf(S.clock.day)}): ${wxNow()} — ${WEATHER[wxNow()].up==="Neutral"?"neutral":`${WEATHER[wxNow()].up}; ${WEATHER[wxNow()].down}`}. Forecast: ${[1,2,3,4,5,6].map(i=>S.wx[S.clock.day+i]).filter(Boolean).map((e,i)=>`${fmtDate(S.clock.day+i+1,{weekday:"short"})} ${e.w}${e.sure?"":" (guess)"}`).join(", ")}.`);
  P("");P(`## Finn`);
  P(`Level ${S.level} (${S.xp}/${xpToReach(S.level+1)} XP) · Combined Level ${combined}${S.statPoints?` · ${plural(S.statPoints,"unspent stat point")}`:""}`);
  P(`- Insight ${st.insight} (${growthTier(st.insight)})`);P(`- Precision ${st.precision} (${growthTier(st.precision)})`);P(`- Renown ${st.renown} (${growthTier(st.renown)})`);

  {const p=P_();P("");P(`## Partnership with Emma Frost`);
   if(p.active){P(`Emma is a silent partner (918,000 Cr invested, ${p.share}% of distributable profit monthly). Distributed so far: ${cr(p.paid)} of the ${cr(p.cap)} cap (${(p.paid/p.cap*100).toFixed(1)}%); buyout today would cost ${cr(owedLeft())}. Salaries: ${(S.payroll||[]).map(r=>`${r.name} (${r.role}) ${cr(r.amount)} ${SCHEDULES[r.schedule].toLowerCase()}${r.owed>0?`, ${cr(r.owed)} owed`:""}`).join("; ")}.`);
     P(`This month so far: ${cr(p.cur.income)} income, ${cr(p.cur.costs)} business costs. Interplanar Trade Permit renews ${fmtShort(S.permitDue)}; Glint Export Permit renews ${fmtShort(S.exportDue)}.`);
     if(p.history[0])P(`Last month (${p.history[0].month}): ${cr(p.history[0].profit)} distributable profit, ${cr(p.history[0].emma)} to Emma.`)}
   else P(p.endedHow==="buyout"?"Finn bought Emma out — she owns the business outright.":"Emma's distributions reached the cap — Finn owns the business outright.");}
  P("");P(`## Factions`);

  if(!reg.length&&!rest.length)P("Not registered with any faction yet.");
  for(const f of [...reg,...rest]){const x=S.factions[f.key];P(`- ${f.name}: Reputation Level ${x.level} (${x.rp}/${rpToReach(x.level+1)} RP), ${x.registered?(x.autoRenew?"registered":"registered, lapsing at month's end"):"not registered"}`)}
  P("");P(`## Active orders (${S.orders.length}/${orderCap()})`);
  if(!S.orders.length)P("None.");
  for(const o of S.orders){
    P(`### ${o.title}`);
    P(`${FAC[o.faction].name}, from ${o.who}${o.planes&&o.planes.length?` (${o.planes.join(", ")})`:""}. Accepted ${fmtShort(o.accepted)}.${o.urgent?(o.missed?" Urgent — deadline missed.":` Urgent, due ${fmtShort(o.deadline)}.`):""}${o.line?` Note: “${o.line}”`:""}`);
    for(const it of o.items){const f=cartOrLot(it);P(`- ${itemShort(it)}${it.kind==="pen"?` (cartridge: ${reqText(it.cart.req,true)}${it.cart.flavor?", "+it.cart.flavor:""})`:""}${it.pref?`, ${it.pref} preferred`:""} — ${itemDone(it)?`done with ${ST(f.strain).name}${Object.keys(f.muts||{}).length?` (${mutPlain(f.muts)})`:""}, ${f.fresh}% fresh`:f?`cartridge filled with ${ST(f.strain).name}, not assembled yet`:"not started"}`)}
    P(`- Stage: ${o.stage==="filling"?"in the workshop":"packed, ready to send"} · live price ${cr(priceOf(o,true).total)}`);
  }
  if(S.offers.length){P("");P(`## Offers waiting (${S.offers.length})`);
    for(const o of S.offers)P(`- ${o.items.map(itemShort).join(" + ")} — ${FAC[o.faction].name} from ${o.who}${o.planes&&o.planes.length?` (${o.planes.join(", ")})`:""}, quoted ${cr(o.quote)}${o.urgent?", urgent":""}, expires ${fmtShort(o.expires)}`)}
  P("");P(`## Glint on hand`);
  const sum=list=>{const by={};for(const l of list){const k=ST(l.strain).name+(Object.keys(l.muts||{}).length?` (${mutPlain(l.muts)})`:"");by[k]=(by[k]||0)+l.buds}return Object.entries(by).map(([k,v])=>`${v} ${k}`).join(", ")};
  P(`- Harvest tanks (wet): ${sum(S.tank)||"empty"}`);
  S.racks.forEach((r,i)=>P(`- Drying rack ${i+1}: ${r.length?r.map(l=>`${l.buds} ${ST(l.strain).name} (${plural(l.daysLeft,"day")} left)`).join(", "):"empty"}`));
  P(`- ${humidorCount()>1?humidorCount()+" Humidors":"Humidor"} (${humidorUsed()}/${humidorCap()}): ${S.humidor.length?S.humidor.map(l=>`${l.buds} ${ST(l.strain).name}${Object.keys(l.muts||{}).length?` (${mutPlain(l.muts)})`:""}${l.fresh<100?` at ${l.fresh}%`:""}`).join(", "):"empty"}`);
  if(S.loose.length)P(`- Loose, losing freshness: ${S.loose.map(l=>`${l.buds} ${ST(l.strain).name} at ${l.fresh}%`).join(", ")}`);
  P(`- Tide pool (${S.pool.length}/${poolCap()}): ${S.pool.length?S.pool.map(p=>`${ST(p.strain).name}${Object.keys(p.muts||{}).length?` (${mutPlain(p.muts)})`:""}`).join(", "):"empty"}${S.tankPlants.length?`; whole plants in the tanks: ${S.tankPlants.map(p=>ST(p.strain).name).join(", ")}`:""}${jeffHere()?". Jeff is napping by the pool today.":""}`);
  {const prog=Object.entries(S.est).filter(([id])=>ST(id));if(prog.length)P(`- Breeding: ${prog.map(([id,e])=>`${ST(id).name} ${e.done?`Established (${SPREADS[e.spread]})`:e.progress+"%"}`).join(", ")}`)}
  P(`- Pens in circulation: ${S.pens.length} (${TIER_KEYS.map(t=>`${S.pens.filter(p=>p.tier===t).length} ${t}`).join(", ")}); ${S.pensSold||0} sold in all.`);
  P(`- Flavor rack: ${S.flavors.length?[...new Set(S.flavors.map(b=>b.flavor))].map(f=>`${f} ${dropsOf(f)} drops`).join(", "):"empty"}`);
  P(`- Parts bins: ${Object.keys(S.bins).filter(k=>S.bins[k]).map(k=>`${S.bins[k]} ${BIN_LABEL(k).toLowerCase()}`).join(", ")}${S.deliveries.length?`; on the way: ${S.deliveries.map(d=>`${d.label} (${fmtShort(d.arrive)})`).join(", ")}`:""}`);
  if((DB.sets||[]).length&&(S.chests.length||S.chestHold.length||S.curio.length||S.uncatalogued.length||S.auctions.length)){
    P("");P(`## Collectables`);
    if(S.chestHold.length||S.chests.length)P(`- Chests: ${S.chestHold.length?`${S.chestHold.map(c=>CHESTS[c.size].label).join(", ")} in the boat's hold (${chestHoldUsed()}/${chestHoldCap()})`:""}${S.chestHold.length&&S.chests.length?"; ":""}${S.chests.length?`${S.chests.map(c=>CHESTS[c.size].label).join(", ")} waiting at home`:""}`);
    if(S.uncatalogued.length)P(`- Waiting to catalog: ${S.uncatalogued.map(u=>`${collItem(u.item).name} (${u.cond})`).join(", ")}`);
    for(const st of DB.sets){const own=setOwned(st.id);if(!own)continue;P(`- ${st.name}: ${own}/${st.items.length} pieces${S.displayed[st.id]?` — on display (${st.bonus.text})`:setComplete(st.id)?" — complete":""}`)}
    const sp=S.curio.filter(c=>!c.display);if(sp.length)P(`- Spare pieces: ${sp.map(c=>`${collItem(c.item).name} (${c.cond}, ${cr(appraised(c))})`).join(", ")}`);
    P(`- Survey Standing ${surveyLevel()} (${S.survey.pts||0} points), ${surveyLimit()-surveyUsed()} of ${surveyLimit()} sales left this month${S.auctions.length?`; at the Salon: ${S.auctions.map(a=>`${a.label} at ${cr(a.bid)}, closes ${fmtShort(a.ends)}`).join("; ")}`:""}`);
  }
  P("");P(`## Nodes`);
  for(const n of visibleNodes()){const rv=revealed(n);P(`- ${cr(tripCost(n))} to reach, ${n.left}/${n.plants} plants left${n.chest?`, ${aChest(CHESTS[n.chest.size])} spotted`:""}${rv.length?`, tags: ${rv.map(t=>tagLabel(n,t)).join(", ")}`:""}${n.tags.length>rv.length?`, ${plural(n.tags.length-rv.length,"hidden tag")}`:""}${S.location===n.id?" — Finn is here":""}`)}
  P("");P(`## Codex`);
  const found=Object.keys(S.codex.found).map(id=>ST(id)).filter(Boolean);
  P(`- ${found.length} strains found: ${found.map(s=>`${s.name} (${affName(s.colors)}; ${kwText(s)})`).join("; ")}`);
  P(`- Mutations discovered: ${Object.keys(S.mutations).length?mutPlain(S.mutations):"none yet"}`);
  const mast=Object.entries(S.mastery).filter(([,v])=>v>0);if(mast.length)P(`- Strain Mastery: ${mast.map(([id,v])=>`${ST(id).name} ${MASTERY_ROMAN[v]}`).join(", ")}`);
  P("");P(`## Career`);
  P(`- Orders delivered: ${S.done.length}${S.done.length?`, most recent: ${S.done.slice(0,3).map(d=>`${d.title} for ${d.who} (${fmtShort(d.day)})`).join("; ")}`:""}`);
  P("");P(`## Recent journal`);
  for(const l of S.log.slice(0,10))P(`- ${l.at} — ${l.text}`);
  return L.join("\n");
}

const MONTH_KEY=dn=>isoOf(dn).slice(0,7);
function monthPicker(tab,list){
  const keys=[...new Set(list.filter(l=>l.day!=null).map(l=>MONTH_KEY(l.day)))].sort().reverse();
  UI.lm=UI.lm||{};let cur=UI.lm[tab];
  if(cur==null)cur=keys.includes(MONTH_KEY(S.clock.day))?MONTH_KEY(S.clock.day):(keys[0]||"all");
  const opts=[...keys.map(k=>[k,fmtDate(dnOf(k+"-01"),{month:"long",year:"numeric"})]),["all","All"]];
  if(!opts.some(o=>o[0]===cur))cur=opts[0][0];
  const sel=cur==="all"?list:list.filter(l=>l.day!=null&&MONTH_KEY(l.day)===cur);
  return {sel,html:`<select data-lm="${tab}" aria-label="Month">${opts.map(([k,l])=>`<option value="${k}" ${k===cur?"selected":""}>${l}</option>`).join("")}</select>`,cur};
}
const moneyRow=l=>`<div class="row between"><span><span class="t">${l.at}</span>${esc(l.text)}</span><span><span class="${l.amt>=0?"cr-plus":"cr-minus"}">${l.amt>=0?"+":""}${cr(l.amt)}</span> <span class="muted tiny">${cr(l.bal)}</span></span></div>`;
function monthTotals(sel){const inc=sel.filter(l=>l.amt>0).reduce((a,l)=>a+l.amt,0),out=sel.filter(l=>l.amt<0).reduce((a,l)=>a+l.amt,0);
  return `<span class="small"><span class="cr-plus">+${cr(inc)}</span> · <span class="cr-minus">${cr(out)}</span></span>`}

    <div class="log">${m.sel.map(l=>`<div><span class="t">${l.at}</span>${esc(l.text)}</div>`).join("")||`<div class="empty">Nothing in this month.</div>`}</div></div>`;

function dayMD(dn){
  const E=(S.events||[]).filter(e=>e.day===dn).slice().reverse();
  const J=S.log.filter(l=>l.day===dn).slice().reverse();
  const M=S.ledger.filter(l=>l.day===dn).slice().reverse();
  const W=(S.wledger||[]).filter(l=>l.day===dn).slice().reverse();
  const L=[],P=x=>L.push(x),by=t=>E.filter(e=>e.type===t),fac=k=>FAC[k]?FAC[k].name:k;
  const oline=e=>`${e.title} — ${fac(e.faction)}, from ${e.who}${e.urgent?" (urgent)":""}`;
  P(`# Finn's Glintworks — ${fmtDate(dn,{weekday:"long",month:"long",day:"numeric",year:"numeric"})}`);
  {const w=by("weather")[0];if(w)P(`*Weather: ${w.w} (${seasonOf(dn)}).*`)}
  if(!E.length&&!J.length&&!M.length){P("");P("Nothing was recorded for this day.");return L.join("\n")}
  const sec=(title,items)=>{if(items.length){P("");P(`## ${title}`);items.forEach(x=>P(`- ${x}`))}};
  sec("On the water",[...by("trip").map(e=>`Sailed out to a node (${cr(e.cost)} Metered Mana)${e.tags&&e.tags.length?`, tags: ${e.tags.join(", ")}`:""}`),
    ...by("plant").map(e=>`${e.twin?"Twin plant":"Harvested"} ${e.name}${e.muts?` (${e.muts})`:""}: ${e.buds} buds${e.kept<e.buds?` (only ${e.kept} fit in the tanks)`:""}${e.discovery?" — a new strain!":""}`),
    ...by("discover").map(e=>`New Codex entry: ${e.name} (${affName(e.colors)})`),
    ...by("coins").map(e=>`${e.why}: ${cr(e.amount)}`),...by("sister").map(e=>e.text),
    ...by("sink").map(e=>e.life?`The Lucky Landshark sank (${e.why}). A Phoenix Feather was spent; Finn and the boat respawned at the dock with the tanks intact`:`The Lucky Landshark sank (${e.why}) with no feathers left: ${e.lost} wet buds went to Rán, salvage tow ${cr(e.tow)}${e.owed>0?` (${cr(e.owed)} owed)`:""}, boat out for 2 days`),
    ...by("repair").map(e=>`Repaired the hull +${e.pts} (${cr(e.cost)})`),...by("home").map(e=>`Returned home${e.loaded?` and loaded ${e.loaded} wet buds onto the racks`:""}${e.left?` (${e.left} wait in the tanks)`:""}`)]);
  sec("Tide pool",[...by("keep").map(e=>`Kept a ${e.name} plant whole for the tide pool`),...by("cross").map(e=>`Crossed ${e.a} × ${e.b} → ${e.child}${e.recipe?` (${e.note})`:" (no recipe — a Colorless dead end)"}${e.muts?`, with ${e.muts}`:""}`),
    ...by("established").map(e=>`${e.name} became Established`),...by("spread").map(e=>`${e.name} spread to ${e.spread} in the wild`),...by("mutation").map(e=>e.tier===1?`Discovered a new mutation: ${e.name}`:`${e.name} rose to tier ${ROMAN[e.tier]}`)]);
  sec("Glintworks",[...by("dried").map(e=>`Dried overnight: ${e.text}`),...by("jar").map(e=>`Jarred and sealed: ${e.text}`),...by("extract").map(e=>e.text),...by("pen").map(e=>`Assembled a ${e.text}`),...by("penGone").map(e=>`A ${e.tier} pen owned by ${e.who} ${e.lost?"was lost":"wore out"}`),...by("hallmark").map(e=>`Ordered from Hallmark's: ${e.text}`),...by("parcel").map(e=>`Hallmark's parcel arrived: ${e.text}`)]);
  sec("Collectables",[...by("chestSpot").map(e=>`Spotted ${aChest(CHESTS[e.size])} near the plants`),...by("hoist").map(e=>`Hoisted ${aChest(CHESTS[e.size])} with the winch`),
    ...by("unbox").map(e=>`Opened ${aChest(CHESTS[e.size])}: ${cr(e.coins)} in loose coins${e.items.length?` and ${e.items.join(", ")}`:""}`),
    ...by("setFound").map(e=>`New Codex set: ${e.name}`),...by("setDone").map(e=>`Completed the ${e.name} set`),...by("display").map(e=>`Arranged ${e.name} on display in the Curio Room`),
    ...by("sale").map(e=>`Sold ${e.label} ${e.where==="Survey"?"to the Survey":"at the Salon"} for ${cr(e.gross)} (kept ${cr(e.net)})`),...by("consign").map(e=>`Consigned ${e.label} to the Salon (appraised ${cr(e.appraised)})`),
    ...by("survey").map(e=>`Survey Standing rose to Level ${e.level}`)]);
  sec("Orders offered",by("offer").map(e=>`${oline(e)}, quoted ${cr(e.quote)}, expires ${fmtShort(e.expires)}`));
  sec("Orders accepted",by("accept").map(e=>`${oline(e)}, quoted ${cr(e.quote)}${e.deadline?`, due ${fmtShort(e.deadline)}`:""}`));
  sec("Orders delivered",by("deliver").map(e=>`${oline(e)} — ${cr(e.total)}, kept ${cr(e.net)} after referral and levy, +${e.rp} RP${e.missed?" (deadline missed)":""}`));
  sec("Passed, expired or cancelled",[...by("pass").map(e=>`Passed on ${oline(e)}`),...by("expire").map(e=>`Expired: ${oline(e)}`),...by("cancel").map(e=>`Cancelled: ${oline(e)}`),...by("missed").map(e=>`Missed the deadline on ${oline(e)}`)]);
  sec("Perk Cards",[...by("pack").map(e=>`Opened a ${e.kind==="starter"?"starter pack":"Perk Pack"}: ${e.cards.join(", ")}`),...by("recut").map(e=>`Recut ${e.name} to max rank ${e.max} (${cr(e.cost)})`)]);
  sec("Payroll",by("salary").map(e=>`Paid ${e.name} ${cr(e.paid)}${e.owed>0?` (${cr(e.owed)} still owed)`:""}`));
  sec("Progress",[...by("level").map(e=>`Reached Level ${e.level}`),...by("rep").map(e=>`Reputation with ${fac(e.faction)} reached Level ${e.level}`),...by("mastery").map(e=>`Strain Mastery ${MASTERY_ROMAN[e.level]}: ${e.name}`)]);
  if(M.length){const inc=M.filter(l=>l.cat==="income").reduce((a,l)=>a+l.amt,0),cost=M.filter(l=>l.cat==="cost").reduce((a,l)=>a-l.amt,0);
    P("");P(`## Money`);P(`Business income ${cr(inc)}, business costs ${cr(cost)}. Business account ended the day at ${cr(M[M.length-1].bal)}.`);
    M.forEach(l=>P(`- ${l.at.split(" ").slice(2).join(" ")} — ${l.text}: ${l.amt>=0?"+":""}${cr(l.amt)}`));
    W.forEach(l=>P(`- ${l.at.split(" ").slice(2).join(" ")} — Finn's wallet: ${l.text}: ${l.amt>=0?"+":""}${cr(l.amt)}`))}
  if(J.length){P("");P(`## Journal`);J.forEach(l=>P(`- ${l.at.split(" ").slice(2).join(" ")} — ${l.text.replace(/^— /,"")}`))}
  return L.join("\n");
}
